services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: florashop
      POSTGRES_USER: florashop
      POSTGRES_PASSWORD: change-me-db-password
    ports:
      - "5432:5432"
    volumes:
      - florashop-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U florashop -d florashop"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://florashop:change-me-db-password@db:5432/florashop
      # SECRET_KEY vide : Flask génère et persiste dans le volume instance.
      SECRET_KEY: ${SECRET_KEY:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      FORCE_HTTPS: ${FORCE_HTTPS:-0}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      MAIL_SERVER: ${MAIL_SERVER:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-1}
      MAIL_SSL: ${MAIL_SSL:-0}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_TO: ${MAIL_TO:-}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_SECRET: ${PAYPAL_SECRET:-}
      PAYPAL_MODE: ${PAYPAL_MODE:-sandbox}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
    volumes:
      - florashop-instance:/app/instance
    depends_on:
      db:
        condition: service_healthy

volumes:
  florashop-pg:
  florashop-instance:
