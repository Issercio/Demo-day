<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mot de passe oublié</title>
    <link rel="stylesheet" href="../static/css/style.css?v=20260921-visual">
    <link rel="stylesheet" href="../static/css/account.css">
</head>
<body>
    <header>
      <img class="logo" src="/static/img/logo.png" alt="Logo pivoine & lilas, artisan fleuriste" width="120" height="100">
      <nav>
        <ul>
          <li><a href="accueil.html">ACCUEIL</a></li>
          <li><a href="shop.html">SHOP</a></li>
          <li><a href="evenementiel.html">ÉVÈNEMENTIEL</a></li>
          <li><a href="entreprises.html">ENTREPRISES</a></li>
          <li><a href="portfolio.html">PORTFOLIO</a></li>
          <li><a href="contact.html">CONTACT</a></li>
          <li><a href="subscription.html">ABONNEMENT</a></li>
          <li>
            <a href="panier.html" id="cart-link" style="position:relative;">
              <span style="font-size:22px;vertical-align:middle;">🛒</span>
              <span id="cart-count" style="position:absolute;top:0;right:-10px;background:#bc6288;color:#fff;font-size:13px;padding:1px 6px;border-radius:10px;display:none;">0</span>
            </a>
          </li>
          <li style="position:relative;">
            <button type="button" id="profile-link" class="profile-icon-btn" aria-label="Compte">👤</button>
            <div id="profile-panel" style="display:none;position:absolute;top:40px;right:0;background:#fff;border:1.5px solid #bc6288;border-radius:8px;box-shadow:0 2px 12px rgba(188,98,136,0.07);padding:12px 18px;z-index:2000;">
              <button id="login-btn" class="cta-btn" style="width:100%;">Se connecter</button>
            </div>
          </li>
        </ul>
      </nav>
    </header>
    <div class="login-container">
        <form class="login-form" id="forgot-password-form">
            <h1>Mot de passe oublié</h1>
            
            <div class="form-group">
                <label for="email">Adresse email</label>
                <input type="email" id="email" required>
            </div>

            <button type="submit" class="login-button">Envoyer le code</button>
            <p id="forgot-feedback" class="text-muted" style="display:none;margin-top:12px;text-align:center;"></p>

            <div id="reset-fields" style="display:none;">
              <div class="form-group">
                <label for="reset-code">Code à 6 chiffres</label>
                <input type="text" id="reset-code" inputmode="numeric" maxlength="6" pattern="[0-9]{6}">
              </div>
              <div class="form-group">
                <label for="new-password">Nouveau mot de passe</label>
                <input type="password" id="new-password" minlength="6">
              </div>
              <button type="button" class="login-button" id="reset-submit">Enregistrer le mot de passe</button>
            </div>

            <div class="help-links">
                <a href="account.html" class="text-muted">Retour à la connexion</a>
            </div>
        </form>
    </div>
    <script src="../static/js/api.js?v=20260925-ops"></script>
    <script>
      function updateCartCount() {
        const cart = window.FloraCart ? FloraCart.get() : [];
        const badge = document.getElementById('cart-count');
        if (badge) {
          badge.textContent = String((window.FloraCart ? FloraCart.count(cart) : cart.reduce((s, i) => s + (Number(i.quantity) || 1), 0)));
          badge.style.display = (window.FloraCart ? FloraCart.count(cart) : cart.reduce((s, i) => s + (Number(i.quantity) || 1), 0)) > 0 ? 'inline-block' : 'none';
        }
      }
      document.addEventListener('DOMContentLoaded', updateCartCount);

      document.addEventListener('DOMContentLoaded', function() {
        const profileLink = document.getElementById('profile-link');
        const profilePanel = document.getElementById('profile-panel');
        const loginBtn = document.getElementById('login-btn');
        profileLink.addEventListener('click', function(e) {
          e.preventDefault();
          profilePanel.style.display = profilePanel.style.display === 'block' ? 'none' : 'block';
        });
        document.addEventListener('click', function(e) {
          if (!profilePanel.contains(e.target) && e.target !== profileLink) {
            profilePanel.style.display = 'none';
          }
        });
        loginBtn.onclick = function() {
          window.location.href = "account.html";
        };

        const forgotForm = document.getElementById('forgot-password-form');
        const forgotFeedback = document.getElementById('forgot-feedback');
        const resetFields = document.getElementById('reset-fields');
        if (forgotForm) {
          forgotForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            forgotFeedback.style.display = 'block';
            if (!email) {
              forgotFeedback.textContent = 'Veuillez renseigner votre adresse email.';
              return;
            }
            const result = await apiService.forgotPassword(email);
            const demo = result.data && result.data.demo_code;
            forgotFeedback.textContent = demo
              ? ((result.data.message || '') + ' Code démo : ' + demo)
              : (result.data && result.data.message) || result.error;
            resetFields.style.display = 'block';
            sessionStorage.setItem('verify_email', email);
            if (demo) sessionStorage.setItem('demo_code', demo);
          });
        }
        const resetSubmit = document.getElementById('reset-submit');
        if (resetSubmit) {
          resetSubmit.addEventListener('click', async function() {
            const email = document.getElementById('email').value.trim();
            const code = document.getElementById('reset-code').value.trim();
            const password = document.getElementById('new-password').value;
            forgotFeedback.style.display = 'block';
            const result = await apiService.resetPassword(email, code, password);
            forgotFeedback.textContent = result.success
              ? (result.data && result.data.message) || 'Mot de passe mis à jour.'
              : (result.error || 'Impossible de réinitialiser');
            if (result.success) {
              setTimeout(function() { window.location.href = 'account.html'; }, 800);
            }
          });
        }
      });
    </script>
    <footer class="site-footer">
      &copy; 2026 Pivoine &amp; Lilas —
      <a href="cgv.html">Conditions générales de vente</a>
    </footer>
</body>
</html>
