<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion</title>
    <link rel="stylesheet" href="../static/css/style.css">
    <link rel="stylesheet" href="../static/css/account.css">
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <style>
      body {
        display: block;
        min-height: 100vh;
      }

      .login-container {
        margin: 150px auto 40px;
      }
    </style>
</head>
<body>
    <header>
      <img class="logo" src="https://static.wixstatic.com/media/8010bb_ce18a16c3f664b8ab22c97455e707ce6~mv2.png/v1/crop/x_748,y_1016,w_3355,h_2788/fill/w_239,h_198,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/Logo%20P%26L%20Rond%20neutre%20pour%20fond%20clairsans%20fond%20-%20by%20fadamentalpics.png" alt="Logo pivoine & lilas, artisan fleuriste" width="120" height="100">
      <nav>
        <ul>
          <li><a href="accueil.html">ACCUEIL</a></li>
          <li><a href="shop.html">SHOP</a></li>
          <li><a href="evenementiel.html">ÉVÉNEMENTIEL</a></li>
          <li><a href="entreprises.html">ENTREPRISES</a></li>
          <li><a href="portfolio.html">PORTFOLIO</a></li>
          <li><a href="contact.html">CONTACT</a></li>
          <li><a href="subscription.html">ABONNEMENT</a></li>
          <li>
            <a href="panier.html" id="cart-link" style="position:relative;">
              <span style="font-size:22px;vertical-align:middle;">🛒</span>
              <span id="cart-count" style="position:absolute;top:0;right:-10px;background:#bc6288;color:#fff;font-size:13px;padding:1px 6px;border-radius:10px;display:none;">0</span>
            </a>
          </li>
          <li style="position:relative;">
            <a href="#" id="profile-link" style="font-size:22px;vertical-align:middle;">👤</a>
            <div id="profile-panel" style="display:none;position:absolute;top:40px;right:0;background:#fff;border:1.5px solid #bc6288;border-radius:8px;box-shadow:0 2px 12px rgba(188,98,136,0.07);padding:12px 18px;z-index:2000;">
                <div id="user-email" style="margin-bottom: 10px; color: #bc6288; font-size: 0.9em; text-align: center; display: none;"></div>
                <button id="login-btn" class="cta-btn" style="width:100%; margin-bottom: 5px;">Se connecter</button>
                <button id="logout-btn" class="cta-btn" style="width:100%; margin-bottom: 5px; display: none;">Déconnexion</button>
                <button id="delete-btn" class="cta-btn" style="width:100%; background: #fff; color: #bc6288; border: 1.5px solid #bc6288; display: none;">Supprimer le compte</button>
            </div>
          </li>
        </ul>
      </nav>
    </header>
    <div class="login-container">
        <form class="login-form" id="login-form">
            <h1>Connexion</h1>
            
            <div class="form-group">
                <label for="email">Adresse email</label>
                <input type="email" id="email" required>
            </div>

            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" required>
            </div>

            <!-- Remplacer l'ancien captcha par reCAPTCHA -->
            <div class="form-group">
                <div class="g-recaptcha" data-sitekey="YOUR_SITE_KEY"></div>
            </div>

            <button type="submit" class="login-button">Se connecter</button>

            <div class="help-links">
                <a href="register.html" class="text-muted">Vous n'avez pas de compte ? Créez-en un !</a>
                <a href="forgot-password.html" class="text-muted">J'ai oublié mon mot de passe</a>
            </div>
        </form>
    </div>
    <script src="../static/js/api.js"></script>
    <script>
        // Fonction pour mettre à jour l'interface utilisateur après connexion/déconnexion
        function updateUIAfterLogin(userData) {
            const userEmail = document.getElementById('user-email');
            const loginBtn = document.getElementById('login-btn');
            const logoutBtn = document.getElementById('logout-btn');
            const deleteBtn = document.getElementById('delete-btn');

            if (userData) {
                userEmail.textContent = userData.email;
                userEmail.style.display = 'block';
                loginBtn.style.display = 'none';
                logoutBtn.style.display = 'block';
                deleteBtn.style.display = 'block';
            } else {
                userEmail.style.display = 'none';
                loginBtn.style.display = 'block';
                logoutBtn.style.display = 'none';
                deleteBtn.style.display = 'none';
            }
        }

        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            console.log('Formulaire soumis');  // Debug log
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            console.log('Tentative de connexion avec:', email);  // Debug log
            const result = await apiService.login(email, password);
            console.log('Résultat de la connexion:', result);  // Debug log
            
            if (result.success) {
                console.log('Connexion réussie, redirection...');  // Debug log
                window.location.href = 'accueil.html';
            } else {
                console.error('Erreur:', result.error);  // Debug log
                alert(result.error);
            }
        });

        document.getElementById('logout-btn').addEventListener('click', function() {
            apiService.logout();
            updateUIAfterLogin(null);
            window.location.reload();
        });

        // Vérifier l'état de connexion au chargement de la page
        document.addEventListener('DOMContentLoaded', function() {
            function updateCartCount() {
                const cart = JSON.parse(localStorage.getItem('cart') || '[]');
                const badge = document.getElementById('cart-count');
                if (badge) {
                  badge.textContent = cart.length;
                  badge.style.display = cart.length > 0 ? 'inline-block' : 'none';
                }
              }
              updateCartCount();

            const profileLink = document.getElementById('profile-link');
            const profilePanel = document.getElementById('profile-panel');
            profileLink.addEventListener('click', function(e) {
              e.preventDefault();
              profilePanel.style.display = profilePanel.style.display === 'block' ? 'none' : 'block';
            });
            document.addEventListener('click', function(e) {
              if (!profilePanel.contains(e.target) && e.target !== profileLink) {
                profilePanel.style.display = 'none';
              }
            });

            // Vérifier si l'utilisateur est déjà connecté
            const userData = JSON.parse(localStorage.getItem('user'));
            if (userData) {
                updateUIAfterLogin(userData);
            }
        });
    </script>
</body>
</html>
