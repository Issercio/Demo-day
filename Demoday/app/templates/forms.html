{% extends "base.html" %}

{% block content %}
<div class="row">
    <!-- User Registration -->
    <div class="col-md-4">
        <div class="card">
            <div class="card-header bg-success text-white">
                <h5 class="card-title mb-0">
                    <i class="bi bi-person-plus"></i> Créer un compte
                </h5>
            </div>
            <div class="card-body">
                <form id="userForm" class="needs-validation">
                    <div class="mb-3">
                        <label class="form-label">Nom d'utilisateur</label>
                        <input type="text" class="form-control" id="username" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Mot de passe</label>
                        <input type="password" class="form-control" id="password" required>
                    </div>
                    <button type="submit" class="btn btn-success">
                        <i class="bi bi-person-plus"></i> S'inscrire
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Product Creation -->
    <div class="col-md-4">
        <div class="card">
            <div class="card-header bg-success text-white">
                <h5 class="card-title mb-0">
                    <i class="bi bi-bag-plus"></i> Ajouter un produit
                </h5>
            </div>
            <div class="card-body">
                <form id="productForm" class="needs-validation">
                    <div class="mb-3">
                        <label class="form-label">Nom du produit</label>
                        <input type="text" class="form-control" id="productName" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Prix</label>
                        <input type="number" class="form-control" id="price" step="0.01" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Catégorie</label>
                        <select class="form-select" id="categorySelect" required>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-success">
                        <i class="bi bi-plus-circle"></i> Ajouter
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Category Creation -->
    <div class="col-md-4">
        <div class="card">
            <div class="card-header bg-success text-white">
                <h5 class="card-title mb-0">
                    <i class="bi bi-folder-plus"></i> Nouvelle catégorie
                </h5>
            </div>
            <div class="card-body">
                <form id="categoryForm" class="needs-validation">
                    <div class="mb-3">
                        <label class="form-label">Nom de la catégorie</label>
                        <input type="text" class="form-control" id="categoryName" required>
                    </div>
                    <button type="submit" class="btn btn-success">
                        <i class="bi bi-plus-circle"></i> Créer
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Token management
    function getToken() {
        return localStorage.getItem('jwt_token');
    }

    function setToken(token) {
        localStorage.setItem('jwt_token', token);
    }

    // Form submissions
    document.getElementById('userForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
            const response = await fetch('/api/v1/users', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    username: document.getElementById('username').value,
                    email: document.getElementById('email').value,
                    password: document.getElementById('password').value
                })
            });
            const data = await response.json();
            if (response.ok) {
                setToken(data.token);
                alert('Compte créé avec succès!');
            } else {
                throw new Error(data.message);
            }
        } catch (error) {
            alert('Erreur: ' + error.message);
        }
    });

    // Similar event listeners for product and category forms...
});
</script>
{% endblock %}
