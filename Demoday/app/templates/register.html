<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Création de compte</title>
    <link rel="stylesheet" href="../static/css/style.css?v=20260921-visual">
    <link rel="stylesheet" href="../static/css/account.css">
</head>
<body>
    <header>
      <img class="logo" src="https://static.wixstatic.com/media/8010bb_ce18a16c3f664b8ab22c97455e707ce6~mv2.png/v1/crop/x_748,y_1016,w_3355,h_2788/fill/w_239,h_198,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/Logo%20P%26L%20Rond%20neutre%20pour%20fond%20clairsans%20fond%20-%20by%20fadamentalpics.png" alt="Logo pivoine & lilas, artisan fleuriste" width="120" height="100">
      <nav>
        <ul>
          <li><a href="accueil.html">ACCUEIL</a></li>
          <li><a href="shop.html">SHOP</a></li>
          <li><a href="evenementiel.html">ÉVÈNEMENTIEL</a></li>
          <li><a href="entreprises.html">ENTREPRISES</a></li>
          <li><a href="portfolio.html">PORTFOLIO</a></li>
          <li><a href="contact.html">CONTACT</a></li>
          <li><a href="subscription.html">ABONNEMENT</a></li>
          <li>
            <a href="panier.html" id="cart-link" style="position:relative;">
              <span style="font-size:22px;vertical-align:middle;">🛒</span>
              <span id="cart-count" style="position:absolute;top:0;right:-10px;background:#bc6288;color:#fff;font-size:13px;padding:1px 6px;border-radius:10px;display:none;">0</span>
            </a>
          </li>
          <li style="position:relative;">
            <button type="button" id="profile-link" class="profile-icon-btn" aria-label="Compte">👤</button>
            <div id="profile-panel" style="display:none;position:absolute;top:40px;right:0;background:#fff;border:1.5px solid #bc6288;border-radius:8px;box-shadow:0 2px 12px rgba(188,98,136,0.07);padding:12px 18px;z-index:2000;">
              <button id="login-btn" class="cta-btn" style="width:100%;">Se connecter</button>
            </div>
          </li>
        </ul>
      </nav>
    </header>
    <div class="login-container register-container">
        <form class="login-form" id="register-form">
            <h1>Création de compte</h1>
            
            <div class="form-group">
                <label for="username">Nom d'utilisateur</label>
                <input type="text" id="username" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required>
            </div>

            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" required>
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirmer le mot de passe</label>
                <input type="password" id="confirm-password" required>
            </div>

            <div class="form-group">
                <label for="phone">Téléphone (optionnel, pour un code SMS)</label>
                <input type="tel" id="phone" placeholder="+33612345678">
            </div>

            <div class="form-group">
                <span>Recevoir le code par</span>
                <label style="font-weight:400;"><input type="radio" name="channel" value="email" checked> Email</label>
                <label style="font-weight:400;"><input type="radio" name="channel" value="sms"> SMS</label>
            </div>

            <button type="submit" class="login-button">Créer mon compte</button>

            <div class="help-links">
                <a href="account.html" class="text-muted">Déjà un compte ? Connectez-vous</a>
            </div>
        </form>
    </div>
    <script src="../static/js/api.js?v=20260925-guest"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const phone = document.getElementById('phone').value.trim();
            const channel = (document.querySelector('input[name="channel"]:checked') || {}).value || 'email';
            
            if (password !== confirmPassword) {
                alert('Les mots de passe ne correspondent pas');
                return;
            }
            
            const extra = { channel };
            if (phone) extra.phone = phone;
            const result = await apiService.register(username, email, password, extra);
            
            if (result.success) {
                const next = new URLSearchParams(window.location.search).get('next') || sessionStorage.getItem('auth_next') || '';
                const params = new URLSearchParams({ email: email });
                if (next) params.set('next', next);
                window.location.href = 'verify-code.html?' + params.toString();
            } else {
                alert(result.error || 'Erreur lors de la création du compte');
            }
        });

        function updateCartCount() {
          const cart = window.FloraCart ? FloraCart.get() : [];
          const badge = document.getElementById('cart-count');
          if (badge) {
            badge.textContent = String((window.FloraCart ? FloraCart.count(cart) : cart.reduce((s, i) => s + (Number(i.quantity) || 1), 0)));
            badge.style.display = (window.FloraCart ? FloraCart.count(cart) : cart.reduce((s, i) => s + (Number(i.quantity) || 1), 0)) > 0 ? 'inline-block' : 'none';
          }
        }
        document.addEventListener('DOMContentLoaded', function() {
            updateCartCount();
            const next = new URLSearchParams(window.location.search).get('next');
            if (next) rememberAuthNext(next);
        });

        document.addEventListener('DOMContentLoaded', function() {
          const profileLink = document.getElementById('profile-link');
          const profilePanel = document.getElementById('profile-panel');
          const loginBtn = document.getElementById('login-btn');
          profileLink.addEventListener('click', function(e) {
            e.preventDefault();
            profilePanel.style.display = profilePanel.style.display === 'block' ? 'none' : 'block';
          });
          document.addEventListener('click', function(e) {
            if (!profilePanel.contains(e.target) && e.target !== profileLink) {
              profilePanel.style.display = 'none';
            }
          });
          loginBtn.onclick = function() {
            window.location.href = "account.html";
          };
        });
    </script>
    <footer class="site-footer">
      &copy; 2026 Pivoine &amp; Lilas —
      <a href="cgv.html">Conditions générales de vente</a>
    </footer>
</body>
</html>
