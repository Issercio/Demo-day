<!DOCTYPE html>
<html>
<head>
    <title>FloraShop API Tester</title>
    <style>
        body { padding: 20px; font-family: Arial; }
        .section { margin-bottom: 20px; padding: 20px; border: 1px solid #ddd; }
        button { margin: 5px; padding: 10px; cursor: pointer; }
        .response { background: #f5f5f5; padding: 10px; margin-top: 10px; }
        .success { color: green; }
        .error { color: red; }
        input { margin: 5px; padding: 5px; }
    </style>
</head>
<body>
    <h1>FloraShop API Tester</h1>

    <div class="section">
        <h2>Utilisateurs</h2>
        <form id="userForm" onsubmit="createUser(event)">
            <input type="text" id="username" placeholder="Nom d'utilisateur" required>
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Mot de passe" required>
            <div>
                <input type="password" id="adminToken" placeholder="Token Admin (optionnel)">
            </div>
            <button type="submit">Créer un compte</button>
        </form>
        <!-- Ajout des nouveaux boutons de test GET -->
        <div class="get-tests">
            <h3>Tests GET/DELETE</h3>
            <input type="number" id="userId" placeholder="ID utilisateur">
            <button onclick="testGetUserById()">Tester GET utilisateur par ID</button>
            <button onclick="testGetAllUsers()">Tester GET tous les utilisateurs</button>
            <button onclick="testDeleteUser()">Tester DELETE utilisateur</button>
        </div>
        <div class="response" id="userResponse"></div>
        <div class="data-list" id="usersList"></div>
    </div>

    <div class="section">
        <h2>Produits</h2>
        <div>
            <input type="text" id="productName" placeholder="Nom du produit">
            <input type="number" id="productPrice" placeholder="Prix">
            <select id="categorySelect"></select>
            <button onclick="createProduct()">Ajouter un produit</button>
        </div>
        <div class="response" id="productResponse"></div>
        <div class="data-list" id="productsList"></div>
        <!-- Ajout du bouton de test GET -->
        <div class="get-tests">
            <h3>Tests GET/DELETE</h3>
            <input type="number" id="productId" placeholder="ID produit">
            <button onclick="testGetProductById()">Tester GET produit par ID</button>
            <button onclick="testDeleteProduct()">Tester DELETE produit</button>
        </div>
    </div>

    <div class="section">
        <h2>Catégories</h2>
        <div>
            <input type="text" id="categoryName" placeholder="Nom de la catégorie">
            <button onclick="createCategory()">Créer une catégorie</button>
        </div>
        <div class="response" id="categoryResponse"></div>
        <div class="data-list" id="categoriesList"></div>
        <!-- Ajout du bouton de test GET -->
        <div class="get-tests">
            <h3>Tests GET/DELETE</h3>
            <input type="number" id="categoryId" placeholder="ID catégorie">
            <button onclick="testGetCategoryById()">Tester GET catégorie par ID</button>
            <button onclick="testDeleteCategory()">Tester DELETE catégorie</button>
        </div>
    </div>

    <script>
        async function createUser(event) {
            event.preventDefault();
            const responseDiv = document.getElementById('userResponse');
            const headers = { 'Content-Type': 'application/json' };
            
            // Ajout du token admin s'il est fourni
            const adminToken = document.getElementById('adminToken').value;
            if (adminToken) {
                headers['Admin-Token'] = adminToken;
            }
            
            try {
                const response = await fetch('/api/v1/users', {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        email: document.getElementById('email').value,
                        password: document.getElementById('password').value
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    responseDiv.innerHTML = `
                        <div class="success">
                            ${data.message}<br>
                            ID: ${data.user.id}<br>
                            Utilisateur: ${data.user.username}<br>
                            Email: ${data.user.email}
                        </div>
                    `;
                    document.getElementById('userForm').reset();
                    getUsers(); // Rafraîchir la liste
                } else {
                    responseDiv.innerHTML = `<div class="error">Erreur: ${data.error}</div>`;
                }
            } catch (error) {
                responseDiv.innerHTML = `<div class="error">Erreur: ${error.message}</div>`;
            }
        }

        async function getUsers() {
            const listDiv = document.getElementById('usersList');
            try {
                const response = await fetch('/api/v1/users');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const users = await response.json();
                
                if (Array.isArray(users)) {
                    listDiv.innerHTML = `
                        <h3>Utilisateurs enregistrés:</h3>
                        <ul>
                            ${users.map(user => `
                                <li>
                                    ID: ${user.id} - ${user.username} (${user.email})
                                    ${user.is_admin ? '<strong style="color: green"> - Admin</strong>' : ''}
                                </li>
                            `).join('')}
                        </ul>
                    `;
                } else {
                    listDiv.innerHTML = `<div class="error">Format de réponse invalide</div>`;
                }
            } catch (error) {
                listDiv.innerHTML = `<div class="error">Erreur de chargement des utilisateurs: ${error.message}</div>`;
            }
        }

        async function createProduct() {
            const name = document.getElementById('productName').value;
            const price = document.getElementById('productPrice').value;
            const categoryId = document.getElementById('categorySelect').value;

            if (!name || !price || !categoryId) {
                document.getElementById('productResponse').innerHTML = `
                    <div style="color: red">
                        Erreur: Tous les champs sont requis
                    </div>
                `;
                return;
            }

            try {
                const response = await fetch('/api/v1/products', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: name,
                        price: price,
                        category_id: categoryId
                    })
                });
                const data = await response.json();
                
                if (response.ok) {
                    document.getElementById('productResponse').innerHTML = `
                        <div style="color: green">
                            ${data.message}
                        </div>
                    `;
                    document.getElementById('productName').value = '';
                    document.getElementById('productPrice').value = '';
                    getProducts();
                } else {
                    document.getElementById('productResponse').innerHTML = `
                        <div style="color: red">
                            Erreur: ${data.error}
                        </div>
                    `;
                }
            } catch (error) {
                document.getElementById('productResponse').innerHTML = `
                    <div style="color: red">
                        Erreur: ${error.message}
                    </div>
                `;
            }
        }

        async function getProducts() {
            try {
                const response = await fetch('/api/v1/products');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const products = await response.json();
                document.getElementById('productsList').innerHTML = `
                    <h3>Produits enregistrés:</h3>
                    <ul>
                        ${products.map(p => `
                            <li>
                                ID: ${p.id} - ${p.name} - Prix: ${p.price}€
                            </li>
                        `).join('')}
                    </ul>
                `;
            } catch (error) {
                document.getElementById('productsList').innerHTML = `
                    <div class="error">Erreur de chargement des produits: ${error.message}</div>
                `;
            }
        }

        async function createCategory() {
            const name = document.getElementById('categoryName').value;
            if (!name) {
                document.getElementById('categoryResponse').innerHTML = `
                    <div style="color: red">Le nom de la catégorie est requis</div>
                `;
                return;
            }

            try {
                const response = await fetch('/api/v1/categories', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name })
                });
                const data = await response.json();
                
                if (response.ok) {
                    document.getElementById('categoryResponse').innerHTML = `
                        <div style="color: green">Catégorie créée avec succès!</div>
                    `;
                    document.getElementById('categoryName').value = '';
                    getCategories(); // Rafraîchir la liste
                } else {
                    document.getElementById('categoryResponse').innerHTML = `
                        <div style="color: red">Erreur: ${data.error}</div>
                    `;
                }
            } catch (error) {
                document.getElementById('categoryResponse').innerHTML = `
                    <div style="color: red">Erreur: ${error.message}</div>
                `;
            }
        }

        async function getCategories() {
            const response = await fetch('/api/v1/categories');
            const categories = await response.json();
            document.getElementById('categoriesList').innerHTML = `
                <h3>Catégories enregistrées:</h3>
                <pre>${JSON.stringify(categories, null, 2)}</pre>
            `;
            updateCategorySelect(categories);
        }

        // Fonction pour mettre à jour le select des catégories
        function updateCategorySelect(categories) {
            const select = document.getElementById('categorySelect');
            select.innerHTML = '<option value="">Sélectionnez une catégorie</option>' +
                categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
        }

        // Nouvelles fonctions pour les tests GET
        async function testGetUserById() {
            const id = document.getElementById('userId').value;
            if (!id) {
                alert('Veuillez entrer un ID');
                return;
            }
            try {
                const response = await fetch(`/api/v1/users/${id}`);
                const data = await response.json();
                document.getElementById('userResponse').innerHTML = `
                    <h4>Résultat du test GET utilisateur:</h4>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                document.getElementById('userResponse').innerHTML = `
                    <div class="error">Erreur: ${error.message}</div>
                `;
            }
        }

        async function testGetProductById() {
            const id = document.getElementById('productId').value;
            if (!id) {
                alert('Veuillez entrer un ID');
                return;
            }
            try {
                const response = await fetch(`/api/v1/products/${id}`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                document.getElementById('productResponse').innerHTML = `
                    <h4>Résultat du test GET produit:</h4>
                    <div>
                        <p>Nom: ${data.name}</p>
                        <p>Catégorie: ${data.category.name}</p>
                    </div>
                `;
            } catch (error) {
                document.getElementById('productResponse').innerHTML = `
                    <div class="error">Erreur: ${error.message}</div>
                `;
            }
        }

        async function testGetCategoryById() {
            const id = document.getElementById('categoryId').value;
            if (!id) {
                alert('Veuillez entrer un ID');
                return;
            }
            try {
                const response = await fetch(`/api/v1/categories/${id}`);
                const data = await response.json();
                document.getElementById('categoryResponse').innerHTML = `
                    <h4>Résultat du test GET catégorie:</h4>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                document.getElementById('categoryResponse').innerHTML = `
                    <div class="error">Erreur: ${error.message}</div>
                `;
            }
        }

        async function testGetAllUsers() {
            try {
                const response = await fetch('/api/v1/users');
                const data = await response.json();
                document.getElementById('userResponse').innerHTML = `
                    <h4>Résultat du test GET tous les utilisateurs:</h4>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                document.getElementById('userResponse').innerHTML = `
                    <div class="error">Erreur: ${error.message}</div>
                `;
            }
        }

        // Ajouter ces nouvelles fonctions dans la partie script
        async function testDeleteUser() {
            const id = document.getElementById('userId').value;
            if (!id) {
                alert('Veuillez entrer un ID');
                return;
            }
            if (confirm('Êtes-vous sûr de vouloir supprimer cet utilisateur ?')) {
                try {
                    const response = await fetch(`/api/v1/users/${id}`, {
                        method: 'DELETE'
                    });
                    const data = await response.json();
                    document.getElementById('userResponse').innerHTML = `
                        <h4>Résultat du test DELETE utilisateur:</h4>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                    if (response.ok) getUsers(); // Rafraîchir la liste
                } catch (error) {
                    document.getElementById('userResponse').innerHTML = `
                        <div class="error">Erreur: ${error.message}</div>
                    `;
                }
            }
        }

        async function testDeleteProduct() {
            const id = document.getElementById('productId').value;
            if (!id) {
                alert('Veuillez entrer un ID');
                return;
            }
            if (confirm('Êtes-vous sûr de vouloir supprimer ce produit ?')) {
                try {
                    const response = await fetch(`/api/v1/products/${id}`, {
                        method: 'DELETE'
                    });
                    const data = await response.json();
                    document.getElementById('productResponse').innerHTML = `
                        <h4>Résultat du test DELETE produit:</h4>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                    if (response.ok) getProducts(); // Rafraîchir la liste
                } catch (error) {
                    document.getElementById('productResponse').innerHTML = `
                        <div class="error">Erreur: ${error.message}</div>
                    `;
                }
            }
        }

        async function testDeleteCategory() {
            const id = document.getElementById('categoryId').value;
            if (!id) {
                alert('Veuillez entrer un ID');
                return;
            }
            if (confirm('Êtes-vous sûr de vouloir supprimer cette catégorie et tous ses produits ?')) {
                try {
                    const response = await fetch(`/api/v1/categories/${id}`, {
                        method: 'DELETE'
                    });
                    const data = await response.json();
                    document.getElementById('categoryResponse').innerHTML = `
                        <h4>Résultat du test DELETE catégorie:</h4>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                    if (response.ok) {
                        getCategories(); // Rafraîchir la liste des catégories
                        getProducts();   // Rafraîchir la liste des produits
                    }
                } catch (error) {
                    document.getElementById('categoryResponse').innerHTML = `
                        <div class="error">Erreur: ${error.message}</div>
                    `;
                }
            }
        }

        // Charger les données au démarrage
        getUsers();
        getProducts();
        getCategories();
    </script>
</body>
</html>
