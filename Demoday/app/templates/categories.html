{% extends "base.html" %}

{% block title %}Categories{% endblock %}

{% block content %}
<div class="container">
    <div class="row mb-4">
        <div class="col-md-12">
            <h2 class="mb-4">
                <i class="bi bi-folder"></i> Categories
            </h2>
            
            <!-- Category Form -->
            <div class="card mb-4">
                <div class="card-header bg-success text-white">
                    <h5 class="card-title mb-0">Add New Category</h5>
                </div>
                <div class="card-body">
                    <form id="categoryForm" class="needs-validation">
                        <div class="row">
                            <div class="col-md-8 mb-3">
                                <label for="categoryName" class="form-label">Category Name</label>
                                <input type="text" class="form-control" id="categoryName" required>
                            </div>
                            <div class="col-md-4 d-flex align-items-end">
                                <button type="submit" class="btn btn-success w-100">
                                    <i class="bi bi-plus-circle"></i> Add Category
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Categories List -->
            <div class="card">
                <div class="card-header bg-light">
                    <h5 class="card-title mb-0">Category List</h5>
                </div>
                <div class="card-body">
                    <div id="categoriesList" class="row row-cols-1 row-cols-md-3 g-4">
                        <!-- Categories will be loaded here -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    async function loadCategories() {
        try {
            const response = await fetch('/api/v1/categories');
            const categories = await response.json();
            const categoriesDiv = document.getElementById('categoriesList');
            categoriesDiv.innerHTML = '';
            
            categories.forEach(category => {
                categoriesDiv.innerHTML += `
                    <div class="col">
                        <div class="card h-100">
                            <div class="card-body">
                                <h5 class="card-title">${category.name}</h5>
                            </div>
                        </div>
                    </div>
                `;
            });
        } catch (error) {
            console.error('Error loading categories:', error);
        }
    }

    document.getElementById('categoryForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const token = localStorage.getItem('jwt_token');
        if (!token) {
            alert('Please log in to add categories');
            return;
        }

        try {
            const response = await fetch('/api/v1/categories', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({
                    name: document.getElementById('categoryName').value
                })
            });

            if (response.ok) {
                alert('Category added successfully!');
                document.getElementById('categoryForm').reset();
                loadCategories();
            } else {
                const data = await response.json();
                throw new Error(data.message || 'Failed to add category');
            }
        } catch (error) {
            alert('Error: ' + error.message);
        }
    });

    // Initial load
    loadCategories();
});
</script>
{% endblock %}
