<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interface Admin - FloraShop</title>
    <link rel="stylesheet" href="../static/css/style.css">
    <style>
        .admin-container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(188,98,136,0.07);
        }
        
        .admin-section {
            margin-bottom: 40px;
            padding: 20px;
            border: 1px solid #e7d6d6;
            border-radius: 8px;
            background: #f8f5f2;
        }
        
        .admin-section h2 {
            color: #bc6288;
            margin-bottom: 20px;
            font-size: 1.4rem;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #bc6288;
            font-weight: 600;
        }
        
        .form-group input, .form-group select {
            width: 100%;
            max-width: 300px;
            padding: 8px 12px;
            border: 1.5px solid #bc6288;
            border-radius: 6px;
            font-size: 1rem;
        }
        
        .btn {
            background: #bc6288;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
            font-size: 0.9rem;
        }
        
        .btn:hover {
            background: #ab597c;
        }
        
        .btn-edit {
            background: #d2a0b5;
        }
        
        .btn-delete {
            background: #dc3545;
        }
        
        .btn-save {
            background: #28a745;
        }
        
        .btn-cancel {
            background: #6c757d;
        }
        
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        .data-table th,
        .data-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e7d6d6;
        }
        
        .data-table th {
            background: #bc6288;
            color: #fff;
            font-weight: 600;
        }
        
        .edit-input {
            width: 100%;
            padding: 4px 8px;
            border: 1px solid #bc6288;
            border-radius: 4px;
        }
        
        .btn-group {
            display: flex;
            gap: 5px;
        }

        /* Styles pour la gestion de stock */
        .stock-status {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .stock-available {
            background: #d4edda;
            color: #155724;
        }

        .stock-low {
            background: #fff3cd;
            color: #856404;
        }

        .stock-out {
            background: #f8d7da;
            color: #721c24;
        }

        .stock-selector {
            border: 1px solid #bc6288;
            border-radius: 4px;
            padding: 2px 4px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <header>
        <img class="logo" src="https://static.wixstatic.com/media/8010bb_ce18a16c3f664b8ab22c97455e707ce6~mv2.png/v1/crop/x_748,y_1016,w_3355,h_2788/fill/w_239,h_198,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/Logo%20P%26L%20Rond%20neutre%20pour%20fond%20clairsans%20fond%20-%20by%20fadamentalpics.png" alt="Logo pivoine & lilas, artisan fleuriste" width="120" height="100">
        <nav>
            <ul>
                <li><a href="accueil.html">ACCUEIL</a></li>
                <li><a href="shop.html">SHOP</a></li>
                <li><a href="evenementiel.html">ÉVÈNEMENTIEL</a></li>
                <li><a href="entreprises.html">ENTREPRISES</a></li>
                <li><a href="portfolio.html">PORTFOLIO</a></li>
                <li><a href="contact.html">CONTACT</a></li>
                <li><a href="subscription.html">ABONNEMENT</a></li>
                <li><a href="panier.html">🛒</a></li>
                <li><a href="admin.html" class="active" style="color:#bc6288;">🔒 ADMIN</a></li>
            </ul>
        </nav>
    </header>

    <div class="admin-container">
        <h1 style="text-align: center; color: #bc6288; margin-bottom: 30px;">Interface d'Administration</h1>

        <!-- SECTION CATÉGORIES -->
        <div class="admin-section">
            <h2>Gestion des Catégories</h2>
            
            <!-- Formulaire de création -->
            <div class="form-group">
                <label for="category-name">Nom de la catégorie :</label>
                <input type="text" id="category-name" placeholder="Nom de la catégorie">
                <button id="create-category-btn" class="btn">Créer Catégorie</button>
            </div>

            <!-- Tableau des catégories -->
            <table class="data-table" id="categories-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nom</th>
                        <th>Produits</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="categories-list">
                    <tr>
                        <td colspan="4" style="text-align: center; color: #bc6288;">Chargement...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- SECTION PRODUITS -->
        <div class="admin-section">
            <h2>Gestion des Produits</h2>
            
            <!-- Formulaire de création -->
            <div style="display: flex; gap: 20px; flex-wrap: wrap;">
                <div class="form-group">
                    <label for="product-name">Nom du produit :</label>
                    <input type="text" id="product-name" placeholder="Nom du produit">
                </div>
                <div class="form-group">
                    <label for="product-price">Prix :</label>
                    <input type="number" id="product-price" placeholder="Prix" step="0.01">
                </div>
                <div class="form-group">
                    <label for="product-category">Catégorie :</label>
                    <select id="product-category">
                        <option value="">Choisir une catégorie</option>
                    </select>
                </div>
                <div class="form-group">
                    <button id="create-product-btn" class="btn">Créer Produit</button>
                </div>
            </div>

            <!-- Tableau des produits -->
            <table class="data-table" id="products-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nom</th>
                        <th>Prix</th>
                        <th>Catégorie</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="products-list">
                    <tr>
                        <td colspan="5" style="text-align: center; color: #bc6288;">Chargement...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let categories = [];
        let products = [];

        // CHARGEMENT DES DONNÉES
        async function loadData() {
            try {
                console.log('=== CHARGEMENT DES DONNÉES ADMIN ===');
                
                // Charger les catégories
                const categoriesResponse = await fetch('/api/v1/categories');
                console.log('Status catégories:', categoriesResponse.status);
                
                if (categoriesResponse.ok) {
                    categories = await categoriesResponse.json();
                    console.log('Catégories chargées:', categories);
                } else {
                    console.error('Erreur chargement catégories:', categoriesResponse.status);
                    categories = [];
                }

                // Charger les produits
                const productsResponse = await fetch('/api/v1/products');
                console.log('Status produits:', productsResponse.status);
                
                if (productsResponse.ok) {
                    products = await productsResponse.json();
                    console.log('Produits chargés:', products);
                } else {
                    console.error('Erreur chargement produits:', productsResponse.status);
                    products = [];
                }

                // Afficher
                renderCategories();
                renderProducts();
                updateCategoryOptions();
                
                console.log('=== FIN CHARGEMENT ===');
            } catch (error) {
                console.error('Erreur lors du chargement des données:', error);
                alert('Erreur lors du chargement des données: ' + error.message);
            }
        }

        // CRÉATION DE CATÉGORIE
        async function createCategory() {
            const name = document.getElementById('category-name').value.trim();
            if (!name) {
                alert('Le nom de la catégorie est requis');
                return;
            }

            try {
                console.log('=== CRÉATION CATÉGORIE ===');
                console.log('Nom:', name);
                
                const response = await fetch('/api/v1/categories', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name: name })
                });

                console.log('Réponse status:', response.status);
                const responseText = await response.text();
                console.log('Réponse text:', responseText);
                
                if (response.ok) {
                    const result = JSON.parse(responseText);
                    console.log('Catégorie créée:', result);
                    document.getElementById('category-name').value = '';
                    await loadData();
                    alert('Catégorie créée avec succès !');
                } else {
                    let errorMessage = 'Erreur inconnue';
                    try {
                        const error = JSON.parse(responseText);
                        errorMessage = error.error || errorMessage;
                    } catch (e) {
                        errorMessage = responseText || errorMessage;
                    }
                    console.error('Erreur création:', errorMessage);
                    alert('Erreur: ' + errorMessage);
                }
            } catch (error) {
                console.error('Erreur réseau:', error);
                alert('Erreur de communication avec le serveur: ' + error.message);
            }
        }

        // CRÉATION DE PRODUIT
        async function createProduct() {
            const name = document.getElementById('product-name').value.trim();
            const price = document.getElementById('product-price').value;
            const categoryId = document.getElementById('product-category').value;

            if (!name || !price || !categoryId) {
                alert('Tous les champs sont requis');
                return;
            }

            try {
                console.log('=== CRÉATION PRODUIT ===');
                console.log('Données:', { name, price, categoryId });
                
                const response = await fetch('/api/v1/products', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        name: name,
                        price: parseFloat(price),
                        category_id: parseInt(categoryId)
                    })
                });

                console.log('Réponse status:', response.status);
                const responseText = await response.text();
                console.log('Réponse text:', responseText);
                
                if (response.ok) {
                    const result = JSON.parse(responseText);
                    console.log('Produit créé:', result);
                    document.getElementById('product-name').value = '';
                    document.getElementById('product-price').value = '';
                    document.getElementById('product-category').value = '';
                    await loadData();
                    alert('Produit créé avec succès !');
                } else {
                    let errorMessage = 'Erreur inconnue';
                    try {
                        const error = JSON.parse(responseText);
                        errorMessage = error.error || errorMessage;
                    } catch (e) {
                        errorMessage = responseText || errorMessage;
                    }
                    console.error('Erreur création produit:', errorMessage);
                    alert('Erreur: ' + errorMessage);
                }
            } catch (error) {
                console.error('Erreur réseau produit:', error);
                alert('Erreur de communication avec le serveur: ' + error.message);
            }
        }

        // RENDER CATEGORIES
        function renderCategories() {
            const tbody = document.getElementById('categories-list');
            if (categories.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #bc6288;">Aucune catégorie trouvée</td></tr>';
                return;
            }
            
            tbody.innerHTML = categories.map(cat => {
                console.log('Rendering category:', cat);
                return `
                <tr data-category-id="${cat.id}">
                    <td>${cat.id}</td>
                    <td>
                        <span class="category-name">${cat.name}</span>
                        <input type="text" class="edit-input category-edit" value="${cat.name}" style="display:none;">
                    </td>
                    <td>${products.filter(p => p.category && p.category.id === cat.id).length}</td>
                    <td>
                        <div class="btn-group">
                            <button class="btn btn-edit" onclick="editCategory(${cat.id})">Modifier</button>
                            <button class="btn btn-delete" onclick="deleteCategory(${cat.id})">Supprimer</button>
                            <button class="btn btn-save category-save" onclick="saveCategory(${cat.id})" style="display:none;">Sauver</button>
                            <button class="btn btn-cancel category-cancel" onclick="cancelEditCategory(${cat.id})" style="display:none;">Annuler</button>
                        </div>
                    </td>
                </tr>
                `;
            }).join('');
        }

        // RENDER PRODUCTS
        function renderProducts() {
            const tbody = document.getElementById('products-list');
            if (products.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #bc6288;">Aucun produit trouvé</td></tr>';
                return;
            }
            
            tbody.innerHTML = products.map(prod => {
                console.log('Rendering product:', prod);
                
                return `
                <tr data-product-id="${prod.id}">
                    <td>${prod.id}</td>
                    <td>
                        <span class="product-name">${prod.name}</span>
                        <input type="text" class="edit-input product-name-edit" value="${prod.name}" style="display:none;">
                    </td>
                    <td>
                        <span class="product-price">${prod.price}€</span>
                        <input type="number" class="edit-input product-price-edit" value="${prod.price}" step="0.01" style="display:none;">
                    </td>
                    <td>
                        <span class="product-category">${prod.category ? prod.category.name : 'Aucune'}</span>
                        <select class="edit-input product-category-edit" style="display:none;">
                            ${categories.map(cat => `<option value="${cat.id}" ${prod.category && prod.category.id === cat.id ? 'selected' : ''}>${cat.name}</option>`).join('')}
                        </select>
                    </td>
                    <td>
                        <div class="btn-group">
                            <button class="btn btn-edit" onclick="editProduct(${prod.id})">Modifier</button>
                            <button class="btn btn-delete" onclick="deleteProduct(${prod.id})">Supprimer</button>
                            <button class="btn btn-save product-save" onclick="saveProduct(${prod.id})" style="display:none;">Sauver</button>
                            <button class="btn btn-cancel product-cancel" onclick="cancelEditProduct(${prod.id})" style="display:none;">Annuler</button>
                        </div>
                    </td>
                </tr>
                `;
            }).join('');
        }

        // TOUTES LES FONCTIONS CATÉGORIES
        function editCategory(id) {
            const row = document.querySelector(`tr[data-category-id="${id}"]`);
            row.querySelector('.category-name').style.display = 'none';
            row.querySelector('.category-edit').style.display = 'block';
            row.querySelector('.btn-edit').style.display = 'none';
            row.querySelector('.btn-delete').style.display = 'none';
            row.querySelector('.category-save').style.display = 'inline-block';
            row.querySelector('.category-cancel').style.display = 'inline-block';
        }

        async function saveCategory(id) {
            const row = document.querySelector(`tr[data-category-id="${id}"]`);
            const newName = row.querySelector('.category-edit').value;
            
            try {
                const response = await fetch(`/api/v1/categories/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: newName })
                });
                
                if (response.ok) {
                    await loadData();
                    alert('Catégorie modifiée avec succès !');
                } else {
                    const error = await response.json();
                    alert('Erreur: ' + error.error);
                }
            } catch (error) {
                console.error('Erreur modification catégorie:', error);
                alert('Erreur de communication');
            }
        }

        async function deleteCategory(id) {
            if (confirm('Supprimer cette catégorie ?')) {
                try {
                    const response = await fetch(`/api/v1/categories/${id}`, {
                        method: 'DELETE'
                    });
                    
                    if (response.ok) {
                        await loadData();
                        alert('Catégorie supprimée avec succès !');
                    } else {
                        const error = await response.json();
                        alert('Erreur: ' + error.error);
                    }
                } catch (error) {
                    console.error('Erreur suppression catégorie:', error);
                    alert('Erreur de communication');
                }
            }
        }

        function cancelEditCategory(id) {
            const row = document.querySelector(`tr[data-category-id="${id}"]`);
            row.querySelector('.category-name').style.display = 'block';
            row.querySelector('.category-edit').style.display = 'none';
            row.querySelector('.btn-edit').style.display = 'inline-block';
            row.querySelector('.btn-delete').style.display = 'inline-block';
            row.querySelector('.category-save').style.display = 'none';
            row.querySelector('.category-cancel').style.display = 'none';
        }

        function updateCategoryOptions() {
            const select = document.getElementById('product-category');
            select.innerHTML = '<option value="">Choisir une catégorie</option>' +
                categories.map(cat => `<option value="${cat.id}">${cat.name}</option>`).join('');
        }

        // FONCTIONS PRODUITS
        function editProduct(id) {
            const row = document.querySelector(`tr[data-product-id="${id}"]`);
            row.querySelector('.product-name').style.display = 'none';
            row.querySelector('.product-name-edit').style.display = 'block';
            row.querySelector('.product-price').style.display = 'none';
            row.querySelector('.product-price-edit').style.display = 'block';
            row.querySelector('.product-category').style.display = 'none';
            row.querySelector('.product-category-edit').style.display = 'block';
            row.querySelector('.btn-edit').style.display = 'none';
            row.querySelector('.btn-delete').style.display = 'none';
            row.querySelector('.product-save').style.display = 'inline-block';
            row.querySelector('.product-cancel').style.display = 'inline-block';
        }

        async function saveProduct(id) {
            const row = document.querySelector(`tr[data-product-id="${id}"]`);
            const newName = row.querySelector('.product-name-edit').value;
            const newPrice = row.querySelector('.product-price-edit').value;
            const newCategoryId = row.querySelector('.product-category-edit').value;
            
            try {
                const response = await fetch(`/api/v1/products/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        name: newName,
                        price: parseFloat(newPrice),
                        category_id: parseInt(newCategoryId)
                    })
                });
                
                if (response.ok) {
                    await loadData();
                    alert('Produit modifié avec succès !');
                } else {
                    const error = await response.json();
                    alert('Erreur: ' + error.error);
                }
            } catch (error) {
                console.error('Erreur modification produit:', error);
                alert('Erreur de communication');
            }
        }

        async function deleteProduct(id) {
            if (confirm('Supprimer ce produit ?')) {
                try {
                    const response = await fetch(`/api/v1/products/${id}`, {
                        method: 'DELETE'
                    });
                    
                    if (response.ok) {
                        await loadData();
                        alert('Produit supprimé avec succès !');
                    } else {
                        const error = await response.json();
                        alert('Erreur: ' + error.error);
                    }
                } catch (error) {
                    console.error('Erreur suppression produit:', error);
                    alert('Erreur de communication');
                }
            }
        }

        function cancelEditProduct(id) {
            const row = document.querySelector(`tr[data-product-id="${id}"]`);
            row.querySelector('.product-name').style.display = 'block';
            row.querySelector('.product-name-edit').style.display = 'none';
            row.querySelector('.product-price').style.display = 'block';
            row.querySelector('.product-price-edit').style.display = 'none';
            row.querySelector('.product-category').style.display = 'block';
            row.querySelector('.product-category-edit').style.display = 'none';
            row.querySelector('.btn-edit').style.display = 'inline-block';
            row.querySelector('.btn-delete').style.display = 'inline-block';
            row.querySelector('.product-save').style.display = 'none';
            row.querySelector('.product-cancel').style.display = 'none';
        }

        // EVENT LISTENERS
        document.addEventListener('DOMContentLoaded', function() {
            console.log('=== PAGE ADMIN CHARGÉE ===');
            loadData();

            // Bouton créer catégorie
            document.getElementById('create-category-btn').addEventListener('click', function(e) {
                e.preventDefault();
                createCategory();
            });

            // Bouton créer produit
            document.getElementById('create-product-btn').addEventListener('click', function(e) {
                e.preventDefault();
                createProduct();
            });
        });
    </script>
</body>
</html>
