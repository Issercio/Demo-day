<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - FloraShop</title>
    <link rel="stylesheet" href="../static/css/style.css">
    <style>
        .admin-container {
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .admin-section {
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
        }
        
        .form-group input, .form-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        
        .item-list {
            margin-top: 20px;
        }
        
        .item-card {
            padding: 10px;
            border: 1px solid #eee;
            margin-bottom: 10px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .delete-btn {
            background: #ff4444;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>
        <!-- ...existing header code... -->
    </header>

    <div class="admin-container">
        <h1>Administration</h1>
        
        <!-- Section Catégories -->
        <div class="admin-section">
            <h2>Gestion des Catégories</h2>
            <form id="category-form">
                <div class="form-group">
                    <label for="category-name">Nom de la catégorie</label>
                    <input type="text" id="category-name" required>
                </div>
                <button type="submit">Ajouter une catégorie</button>
            </form>
            <div id="categories-list" class="item-list">
                <!-- Les catégories seront ajoutées ici dynamiquement -->
            </div>
        </div>
        
        <!-- Section Produits -->
        <div class="admin-section">
            <h2>Gestion des Produits</h2>
            <form id="product-form">
                <div class="form-group">
                    <label for="product-name">Nom du produit</label>
                    <input type="text" id="product-name" required>
                </div>
                <div class="form-group">
                    <label for="product-price">Prix</label>
                    <input type="number" id="product-price" step="0.01" required>
                </div>
                <div class="form-group">
                    <label for="product-category">Catégorie</label>
                    <select id="product-category" required>
                        <!-- Les catégories seront ajoutées ici dynamiquement -->
                    </select>
                </div>
                <button type="submit">Ajouter un produit</button>
            </form>
            <div id="products-list" class="item-list">
                <!-- Les produits seront ajoutés ici dynamiquement -->
            </div>
        </div>
    </div>

    <script src="../static/js/api.js"></script>
    <script>
        // Vérification de l'authentification admin
        if (!apiService.isLoggedIn() || !apiService.isAdmin()) {
            window.location.href = 'account.html';
        }

        // Fonctions de mise à jour de l'interface
        async function refreshCategories() {
            const categories = await apiService.getCategories();
            const categoriesList = document.getElementById('categories-list');
            const categorySelect = document.getElementById('product-category');
            
            categoriesList.innerHTML = '';
            categorySelect.innerHTML = '<option value="">Sélectionnez une catégorie</option>';
            
            categories.forEach(category => {
                // Liste des catégories
                const categoryDiv = document.createElement('div');
                categoryDiv.className = 'item-card';
                categoryDiv.innerHTML = `
                    <span>${category.name}</span>
                    <button class="delete-btn" onclick="deleteCategory('${category.id}')">Supprimer</button>
                `;
                categoriesList.appendChild(categoryDiv);
                
                // Select des catégories
                const option = document.createElement('option');
                option.value = category.id;
                option.textContent = category.name;
                categorySelect.appendChild(option);
            });
        }

        async function refreshProducts() {
            const products = await apiService.getProducts();
            const productsList = document.getElementById('products-list');
            
            productsList.innerHTML = '';
            products.forEach(product => {
                const productDiv = document.createElement('div');
                productDiv.className = 'item-card';
                productDiv.innerHTML = `
                    <span>${product.name} - ${product.price}€</span>
                    <button class="delete-btn" onclick="deleteProduct('${product.id}')">Supprimer</button>
                `;
                productsList.appendChild(productDiv);
            });
        }

        // Gestionnaires d'événements pour les formulaires
        document.getElementById('category-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const name = document.getElementById('category-name').value;
            const result = await apiService.createCategory({ name });
            if (result.success) {
                document.getElementById('category-name').value = '';
                refreshCategories();
            } else {
                alert('Erreur lors de la création de la catégorie');
            }
        });

        document.getElementById('product-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const productData = {
                name: document.getElementById('product-name').value,
                price: parseFloat(document.getElementById('product-price').value),
                category_id: document.getElementById('product-category').value
            };
            const result = await apiService.createProduct(productData);
            if (result.success) {
                document.getElementById('product-form').reset();
                refreshProducts();
            } else {
                alert('Erreur lors de la création du produit');
            }
        });

        // Fonctions de suppression
        async function deleteCategory(id) {
            if (confirm('Êtes-vous sûr de vouloir supprimer cette catégorie ?')) {
                const success = await apiService.deleteCategory(id);
                if (success) {
                    refreshCategories();
                    refreshProducts();
                } else {
                    alert('Erreur lors de la suppression de la catégorie');
                }
            }
        }

        async function deleteProduct(id) {
            if (confirm('Êtes-vous sûr de vouloir supprimer ce produit ?')) {
                const success = await apiService.deleteProduct(id);
                if (success) {
                    refreshProducts();
                } else {
                    alert('Erreur lors de la suppression du produit');
                }
            }
        }

        // Initialisation
        document.addEventListener('DOMContentLoaded', function() {
            refreshCategories();
            refreshProducts();
        });
    </script>
</body>
</html>
