<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Contact - Pivoine &amp; Lilas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="twitter:image" content="/static/img/logo.png"/>
  <link rel="stylesheet" href="../static/css/style.css?v=20260921-visual">
</head>
<body>
  <header>
    <img class="logo" src="/static/img/logo.png" alt="Logo pivoine & lilas, artisan fleuriste" width="120" height="100">
    <nav>
      <ul>
        <li><a href="accueil.html">ACCUEIL</a></li>
        <li><a href="shop.html">SHOP</a></li>
        <li><a href="evenementiel.html">ÉVÈNEMENTIEL</a></li>
        <li><a href="entreprises.html">ENTREPRISES</a></li>
        <li><a href="portfolio.html">PORTFOLIO</a></li>
        <li><a href="contact.html" class="active">CONTACT</a></li>
        <li><a href="subscription.html">ABONNEMENT</a></li>
        <li>
          <a href="panier.html" id="cart-link" style="position:relative;">
            <span style="font-size:22px;vertical-align:middle;">🛒</span>
            <span id="cart-count" style="position:absolute;top:0;right:-10px;background:#bc6288;color:#fff;font-size:13px;padding:1px 6px;border-radius:10px;display:none;">0</span>
          </a>
        </li>
        <li style="position:relative;">
          <button type="button" id="profile-link" class="profile-icon-btn" aria-label="Compte">👤</button>
          <div id="profile-panel" style="display:none;position:absolute;top:40px;right:0;background:#fff;border:1.5px solid #bc6288;border-radius:8px;box-shadow:0 2px 12px rgba(188,98,136,0.07);padding:12px 18px;z-index:2000;min-width:200px;">
            <div id="user-email" style="margin-bottom: 15px; color: #bc6288; font-size: 0.9em; text-align: center; border-bottom: 1px solid #eee; padding-bottom: 10px; display: none;"></div>
            <button id="login-btn" class="cta-btn" style="width:100%; margin-bottom: 8px;">Se connecter</button>
            <button id="logout-btn" class="cta-btn" style="width:100%; margin-bottom: 8px; display: none;">Déconnexion</button>
            <button id="profile-btn" class="cta-btn" style="width:100%; margin-bottom: 8px; display: none;">Modifier le profil</button>
            <button id="password-btn" class="cta-btn" style="width:100%; margin-bottom: 8px; display: none;">Changer le mot de passe</button>
            <button id="delete-btn" class="cta-btn" style="width:100%; background: #fff; color: #bc6288; border: 1.5px solid #bc6288; display: none;">Supprimer le compte</button>
          </div>
        </li>
      </ul>
    </nav>
  </header>
  <main class="main-content">
    <h1>Contact</h1>
    <p>
      Une question, une demande particulière, un devis ?<br>
      Écrivez-nous via le formulaire : l'atelier vous répond.
    </p>
    <form id="contact-form">
      <input type="text" name="nom" placeholder="Votre nom" required>
      <input type="email" name="email" placeholder="Votre email" required>
      <textarea name="message" rows="5" placeholder="Votre message" required></textarea>
      <button type="submit" class="cta-btn">Envoyer</button>
    </form>
    <p id="contact-feedback" style="display:none;text-align:center;color:#2d7a58;margin-top:16px;"></p>
  </main>
  <footer class="site-footer">
    &copy; 2026 Pivoine &amp; Lilas —
    <a href="cgv.html">Conditions générales de vente</a>
  </footer>
  <script src="../static/js/api.js?v=20260925-ops"></script>
  <script>
  document.addEventListener('DOMContentLoaded', function() {
    const userEmail = document.getElementById('user-email');
    const loginBtn = document.getElementById('login-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const deleteBtn = document.getElementById('delete-btn');
    const profilePanel = document.getElementById('profile-panel');
    const profileLink = document.getElementById('profile-link');

    // Vérifier la connexion
    const userData = JSON.parse(localStorage.getItem('user'));
    if (userData) {
        userEmail.textContent = userData.username || userData.email;
        userEmail.style.display = 'block';
        loginBtn.style.display = 'none';
        logoutBtn.style.display = 'block';
        deleteBtn.style.display = 'block';
    }

    // Gestion du panel
    profileLink.addEventListener('click', function(e) {
        e.preventDefault();
        profilePanel.style.display = profilePanel.style.display === 'block' ? 'none' : 'block';
    });

    document.addEventListener('click', function(e) {
        if (!profilePanel.contains(e.target) && e.target !== profileLink) {
            profilePanel.style.display = 'none';
        }
    });

    // Boutons
    loginBtn.addEventListener('click', () => window.location.href = 'account.html');
    logoutBtn.addEventListener('click', () => {
        localStorage.removeItem('user');
        localStorage.removeItem('auth_token');
        window.location.reload();
    });

    const contactForm = document.getElementById('contact-form');
    const contactFeedback = document.getElementById('contact-feedback');
    if (contactForm) {
      contactForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        const body = {
          name: contactForm.nom.value,
          email: contactForm.email.value,
          message: contactForm.message.value
        };
        try {
          const response = await fetch('/api/v1/contact', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          });
          const data = await response.json().catch(() => ({}));
          if (response.ok) {
            contactFeedback.textContent = 'Merci, votre message est bien arrivé à l’atelier.';
            contactFeedback.style.color = '#2d7a58';
            contactForm.reset();
          } else {
            contactFeedback.textContent = data.error || 'Impossible d’envoyer le message.';
            contactFeedback.style.color = '#8a1f2b';
          }
        } catch (error) {
          contactFeedback.textContent = 'Impossible d’envoyer le message.';
          contactFeedback.style.color = '#8a1f2b';
        }
        contactFeedback.style.display = 'block';
      });
    }

    function updateCartCount() {
      const cart = window.FloraCart ? FloraCart.get() : [];
      const badge = document.getElementById('cart-count');
      if (badge) {
        badge.textContent = String((window.FloraCart ? FloraCart.count(cart) : cart.reduce((s, i) => s + (Number(i.quantity) || 1), 0)));
        badge.style.display = (window.FloraCart ? FloraCart.count(cart) : cart.reduce((s, i) => s + (Number(i.quantity) || 1), 0)) > 0 ? 'inline-block' : 'none';
      }
    }
    updateCartCount();
  });
</script>
</body>
</html>
