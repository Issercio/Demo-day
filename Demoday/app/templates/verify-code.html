<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vérification du compte</title>
    <link rel="stylesheet" href="../static/css/account.css">
    <style>
        .site-footer {
            text-align: center;
            color: #f9edf2;
            font-size: 16px;
            margin-top: 24px;
            padding: 18px 12px;
            background: linear-gradient(90deg, #7f3f5a 0%, #bc6288 100%);
            border-top: 2px solid #d7a9bd;
            letter-spacing: 0.01em;
            font-weight: 600;
        }

        .site-footer a {
            color: #fff;
            text-decoration: underline;
            text-underline-offset: 3px;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="login-container verify-container">
        <form class="login-form">
            <h1>Vérification du compte</h1>
            
            <p class="verify-text">Un code a été envoyé à votre boîte email.<br>
            Veuillez entrer le code à 6 chiffres pour valider votre compte.</p>

            <div class="code-input-container">
                <input type="text" maxlength="1" class="code-input" pattern="[0-9]" required>
                <input type="text" maxlength="1" class="code-input" pattern="[0-9]" required>
                <input type="text" maxlength="1" class="code-input" pattern="[0-9]" required>
                <input type="text" maxlength="1" class="code-input" pattern="[0-9]" required>
                <input type="text" maxlength="1" class="code-input" pattern="[0-9]" required>
                <input type="text" maxlength="1" class="code-input" pattern="[0-9]" required>
            </div>

            <button type="submit" class="login-button">Valider</button>

            <div class="help-links">
                <a href="#" class="text-muted">Renvoyer le code</a>
            </div>
        </form>
    </div>
    <footer class="site-footer">
