{% extends "base.html" %}

{% block title %}Users{% endblock %}

{% block content %}
<div class="container">
    <div class="row mb-4">
        <div class="col-md-12">
            <h2 class="mb-4">
                <i class="bi bi-people"></i> Users
            </h2>
            
            <!-- User Form -->
            <div class="card mb-4">
                <div class="card-header bg-success text-white">
                    <h5 class="card-title mb-0">Register New User</h5>
                </div>
                <div class="card-body">
                    <form id="userForm" class="needs-validation">
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" class="form-control" id="username" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-person-plus"></i> Register User
                        </button>
                    </form>
                </div>
            </div>

            <!-- Users List -->
            <div class="card">
                <div class="card-header bg-light">
                    <h5 class="card-title mb-0">User List</h5>
                </div>
                <div class="card-body">
                    <div id="usersList" class="table-responsive">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Username</th>
                                    <th>Email</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Users will be loaded here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    async function loadUsers() {
        try {
            const response = await fetch('/api/v1/users');
            const users = await response.json();
            const tbody = document.querySelector('#usersList tbody');
            tbody.innerHTML = '';
            
            users.forEach(user => {
                tbody.innerHTML += `
                    <tr>
                        <td>${user.username}</td>
                        <td>${user.email}</td>
                    </tr>
                `;
            });
        } catch (error) {
            console.error('Error loading users:', error);
        }
    }

    document.getElementById('userForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
            const response = await fetch('/api/v1/users', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    username: document.getElementById('username').value,
                    email: document.getElementById('email').value,
                    password: document.getElementById('password').value
                })
            });

            if (response.ok) {
                alert('User registered successfully!');
                document.getElementById('userForm').reset();
                loadUsers();
            } else {
                const data = await response.json();
                throw new Error(data.message || 'Failed to register user');
            }
        } catch (error) {
            alert('Error: ' + error.message);
        }
    });

    // Initial load
    loadUsers();
});
</script>
{% endblock %}
