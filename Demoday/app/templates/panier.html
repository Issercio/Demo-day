<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Votre Panier - Pivoine & Lilas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../static/css/style.css">
  <style>
    .cart-table-container {
      max-width: 1100px;
      margin: 50px auto 30px auto;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 2px 12px rgba(188,98,136,0.07);
      padding: 36px 32px 32px 32px;
    }
    .cart-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 30px;
    }
    .cart-table th, .cart-table td {
      padding: 18px 12px;
      text-align: left;
      border-bottom: 1.5px solid #e7d6d6;
      font-size: 1.08rem;
    }
    .cart-table th {
      background: #f8f5f2;
      color: #bc6288;
      font-size: 1.13rem;
      font-weight: 700;
      letter-spacing: 0.01em;
    }
    .cart-table td .color-dot {
      margin-left: 7px;
      vertical-align: middle;
    }
    .cart-table td .remove-btn {
      background: none;
      border: none;
      color: #bc6288;
      font-size: 1.2rem;
      cursor: pointer;
      margin-left: 10px;
      transition: color 0.15s;
    }
    .cart-table td .remove-btn:hover {
      color: #ab597c;
    }
    .cart-summary {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 18px;
      margin-top: 18px;
    }
    .cart-total {
      font-size: 1.25rem;
      font-weight: bold;
      color: #ab597c;
    }
    .cart-actions {
      display: flex;
      gap: 18px;
      margin-top: 10px;
    }
    .pay-btn, .choose-method-btn {
      background: linear-gradient(90deg, #d2a0b5 60%, #bc6288 100%);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-family: 'Inter', serif;
      font-weight: 600;
      padding: 12px 32px;
      cursor: pointer;
      transition: background 0.18s;
      box-shadow: 0 2px 8px rgba(188,98,136,0.07);
    }
    .pay-btn:disabled {
      background: #ccc;
      color: #fff;
      cursor: not-allowed;
    }
    .choose-method-btn {
      background: #fff;
      color: #bc6288;
      border: 2px solid #bc6288;
    }
    .choose-method-btn:hover {
      background: #bc6288;
      color: #fff;
    }
    @media (max-width: 900px) {
      .cart-table-container { padding: 18px 4vw 24px 4vw; }
      .cart-actions { flex-direction: column; align-items: stretch; }
    }
    @media (max-width: 600px) {
      .cart-table-container { padding: 8px 2vw 14px 2vw; }
      .cart-table th, .cart-table td { padding: 10px 4px; font-size: 0.97rem; }
      .cart-total { font-size: 1.05rem; }
    }
  </style>
</head>
<body>
  <header>
    <img class="logo" src="https://static.wixstatic.com/media/8010bb_ce18a16c3f664b8ab22c97455e707ce6~mv2.png/v1/crop/x_748,y_1016,w_3355,h_2788/fill/w_239,h_198,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/Logo%20P%26L%20Rond%20neutre%20pour%20fond%20clairsans%20fond%20-%20by%20fadamentalpics.png" alt="Logo pivoine & lilas, artisan fleuriste" width="120" height="100">
    <nav>
      <ul>
        <li><a href="accueil.html">ACCUEIL</a></li>
        <li><a href="shop.html">SHOP</a></li>
        <li><a href="evenementiel.html">ÉVÈNEMENTIEL</a></li>
        <li><a href="entreprises.html">ENTREPRISES</a></li>
        <li><a href="portfolio.html">PORTFOLIO</a></li>
        <li><a href="contact.html">CONTACT</a></li>
        <li><a href="subscription.html">ABONNEMENT</a></li>
        <li>
          <a href="panier.html" id="cart-link" style="position:relative;">
            <span style="font-size:22px;vertical-align:middle;">
              🛒
            </span>
            <span id="cart-count" style="position:absolute;top:0;right:-10px;background:#bc6288;color:#fff;font-size:13px;padding:1px 6px;border-radius:10px;display:none;">0</span>
          </a>
        </li>
      </ul>
    </nav>
  </header>
  <main>
    <div class="cart-table-container">
      <h1 style="text-align:center;margin-bottom:32px;">Votre Panier</h1>
      <div id="cart-content"></div>
      <div class="cart-summary" id="cart-summary" style="display:none;">
        <div class="cart-total" id="cart-total"></div>
        <div class="cart-actions">
          <button id="choose-method-btn" class="choose-method-btn">💳 Méthodes de paiement</button>
          <button id="pay-btn" class="pay-btn">🔒 Finaliser la commande</button>
        </div>
      </div>
    </div>
  </main>
  <script>
    function updateCartCount() {
      const cart = JSON.parse(localStorage.getItem('cart') || '[]');
      const badge = document.getElementById('cart-count');
      if (badge) {
        badge.textContent = cart.length;
        badge.style.display = cart.length > 0 ? 'inline-block' : 'none';
      }
    }

    function renderCart() {
      const cart = JSON.parse(localStorage.getItem('cart') || '[]');
      const cartContent = document.getElementById('cart-content');
      const cartSummary = document.getElementById('cart-summary');
      const cartTotal = document.getElementById('cart-total');
      const payBtn = document.getElementById('pay-btn');
      const chooseBtn = document.getElementById('choose-method-btn');
      if (cart.length === 0) {
        cartContent.innerHTML = "<p style='text-align:center;color:#bc6288;'>Votre panier est vide.</p>";
        cartSummary.style.display = "none";
        return;
      }
      let total = 0;
      const getCategoryLabel = (prod) => {
        if (!prod || !prod.category) {
          return prod && prod.type === 'subscription' ? 'Abonnement' : '-';
        }
        if (typeof prod.category === 'string') {
          return prod.category;
        }
        if (prod.category.name) {
          return prod.category.name;
        }
        return prod.type === 'subscription' ? 'Abonnement' : '-';
      };

      cartContent.innerHTML = `
        <table class="cart-table">
          <thead>
            <tr>
              <th>Produit</th>
              <th>Catégorie</th>
              <th>Couleurs</th>
              <th>Prix</th>
              <th>Retirer</th>
            </tr>
          </thead>
          <tbody>
            ${cart.map((prod, idx) => {
              total += Number(prod.price);
              return `
                <tr>
                  <td style="font-weight:bold;color:#ab597c;">${prod.name}</td>
                  <td>${getCategoryLabel(prod)}</td>
                  <td>
                    ${(prod.colors && prod.colors.length) ? prod.colors.map(c => `<span class="color-dot" style="background:${c};"></span>`).join('') : ''}
                  </td>
                  <td><span style="font-weight:bold;">${Number(prod.price).toFixed(2)} €</span></td>
                  <td>
                    <button class="remove-btn" onclick="removeFromCart(${idx})" title="Retirer">✕</button>
                  </td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      `;
      cartTotal.textContent = "Total : " + total.toFixed(2) + " €";
      cartSummary.style.display = "flex";
      // Le bouton Payer est toujours activé s'il y a des produits
      payBtn.disabled = false;
    }

    function removeFromCart(idx) {
      let cart = JSON.parse(localStorage.getItem('cart') || '[]');
      cart.splice(idx, 1);
      localStorage.setItem('cart', JSON.stringify(cart));
      renderCart();
      updateCartCount();
    }

    document.getElementById('pay-btn').addEventListener('click', function() {
      // Sauvegarder le panier et rediriger vers la page de checkout
      const cart = JSON.parse(localStorage.getItem('cart') || '[]');
      if (cart.length === 0) {
        alert('Votre panier est vide !');
        return;
      }
      
      // Redirection vers la page de checkout
      localStorage.setItem('selected_payment_method', 'card');
      window.location.href = 'checkout.html?method=card';
    });

    document.getElementById('choose-method-btn').addEventListener('click', function() {
      // Afficher le modal de choix de méthode de paiement
      showPaymentMethodModal();
    });

    // Modal de choix de méthode de paiement
    function showPaymentMethodModal() {
      const cart = JSON.parse(localStorage.getItem('cart') || '[]');
      if (cart.length === 0) {
        alert('Votre panier est vide !');
        return;
      }

      // Créer le modal
      const modal = document.createElement('div');
      modal.style.cssText = `
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.5);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;
      `;

      modal.innerHTML = `
        <div style="
          background: white;
          padding: 40px;
          border-radius: 20px;
          max-width: 500px;
          width: 90%;
          text-align: center;
          box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        ">
          <h2 style="color: #bc6288; margin-bottom: 30px;">💳 Choisir votre méthode de paiement</h2>
          
          <div style="margin-bottom: 30px;">
            <button onclick="selectPaymentMethod('card')" style="
              display: block;
              width: 100%;
              padding: 20px;
              margin-bottom: 15px;
              background: linear-gradient(45deg, #bc6288, #d4819f);
              color: white;
              border: none;
              border-radius: 15px;
              font-size: 18px;
              cursor: pointer;
              transition: transform 0.2s ease;
            " onmouseover="this.style.transform='translateY(-2px)'" onmouseout="this.style.transform='translateY(0)'">
              💳 Carte bancaire (Stripe)
              <br><small style="opacity: 0.8;">Paiement sécurisé</small>
            </button>
            
            <button onclick="selectPaymentMethod('paypal')" style="
              display: block;
              width: 100%;
              padding: 20px;
              margin-bottom: 15px;
              background: linear-gradient(45deg, #0070ba, #003087);
              color: white;
              border: none;
              border-radius: 15px;
              font-size: 18px;
              cursor: pointer;
              transition: transform 0.2s ease;
            " onmouseover="this.style.transform='translateY(-2px)'" onmouseout="this.style.transform='translateY(0)'">
              💳 PayPal
              <br><small style="opacity: 0.8;">Paiement rapide</small>
            </button>
            
            <button onclick="selectPaymentMethod('saved')" style="
              display: block;
              width: 100%;
              padding: 20px;
              margin-bottom: 20px;
              background: linear-gradient(45deg, #28a745, #20c997);
              color: white;
              border: none;
              border-radius: 15px;
              font-size: 18px;
              cursor: pointer;
              transition: transform 0.2s ease;
            " onmouseover="this.style.transform='translateY(-2px)'" onmouseout="this.style.transform='translateY(0)'">
              💾 Cartes enregistrées
              <br><small style="opacity: 0.8;">Paiement express</small>
            </button>
          </div>
          
          <button onclick="closePaymentModal()" style="
            background: #6c757d;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
          ">
            Annuler
          </button>
        </div>
      `;

      document.body.appendChild(modal);
      
      // Fermer le modal en cliquant à l'extérieur
      modal.addEventListener('click', function(e) {
        if (e.target === modal) {
          closePaymentModal();
        }
      });
    }

    // Sélectionner une méthode de paiement
    window.selectPaymentMethod = function(method) {
      const cart = JSON.parse(localStorage.getItem('cart') || '[]');
      if (cart.length === 0) {
        alert('Votre panier est vide !');
        closePaymentModal();
        return;
      }

      localStorage.setItem('selected_payment_method', method);
      
      switch(method) {
        case 'card':
          window.location.href = 'checkout.html?method=card';
          break;
          
        case 'paypal':
          window.location.href = 'checkout.html?method=paypal';
          break;
          
        case 'saved':
          window.location.href = 'checkout.html?method=saved';
          break;
      }
      
      closePaymentModal();
    };

    // Fermer le modal
    window.closePaymentModal = function() {
      const modal = document.querySelector('div[style*="position: fixed"]');
      if (modal) {
        document.body.removeChild(modal);
      }
    };

    document.addEventListener('DOMContentLoaded', function() {
      renderCart();
      updateCartCount();
    });
  </script>
</body>
</html>
