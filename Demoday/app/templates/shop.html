<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Boutique Florale</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../static/css/style.css">
</head>
<body>
  <header>
    <img class="logo" src="https://static.wixstatic.com/media/8010bb_ce18a16c3f664b8ab22c97455e707ce6~mv2.png/v1/crop/x_748,y_1016,w_3355,h_2788/fill/w_239,h_198,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/Logo%20P%26L%20Rond%20neutre%20pour%20fond%20clairsans%20fond%20-%20by%20fadamentalpics.png" alt="Logo pivoine & lilas, artisan fleuriste" width="120" height="100">
    <nav>
      <ul>
        <li><a href="accueil.html">ACCUEIL</a></li>
        <li><a href="shop.html" class="active">SHOP</a></li>
        <li><a href="evenementiel.html">ÉVÈNEMENTIEL</a></li>
        <li><a href="entreprises.html">ENTREPRISES</a></li>
        <li><a href="portfolio.html">PORTFOLIO</a></li>
        <li><a href="contact.html">CONTACT</a></li>
        <li><a href="subscription.html">ABONNEMENT</a></li>
        <li>
          <a href="panier.html" id="cart-link" style="position:relative;">
            <span style="font-size:22px;vertical-align:middle;">🛒</span>
            <span id="cart-count" style="position:absolute;top:0;right:-10px;background:#bc6288;color:#fff;font-size:13px;padding:1px 6px;border-radius:10px;display:none;">0</span>
          </a>
        </li>
        <!-- Cadenas admin -->
        <li id="admin-access" style="display:none;">
          <a href="admin.html" style="font-size:22px;vertical-align:middle;color:#bc6288;" title="Administration">🔒</a>
        </li>
        <li style="position:relative;">
          <a href="#" id="profile-link" style="font-size:22px;vertical-align:middle;">👤</a>
          <div id="profile-panel" style="display:none;position:absolute;top:40px;right:0;background:#fff;border:1.5px solid #bc6288;border-radius:8px;box-shadow:0 2px 12px rgba(188,98,136,0.07);padding:12px 18px;z-index:2000;min-width:200px;">
            <div id="user-email" style="margin-bottom: 15px; color: #bc6288; font-size: 0.9em; text-align: center; border-bottom: 1px solid #eee; padding-bottom: 10px; display: none;"></div>
            <button id="login-btn" class="cta-btn" style="width:100%; margin-bottom: 8px;">Se connecter</button>
            <button id="logout-btn" class="cta-btn" style="width:100%; margin-bottom: 8px; display: none;">Déconnexion</button>
            <button id="delete-btn" class="cta-btn" style="width:100%; background: #fff; color: #bc6288; border: 1.5px solid #bc6288; display: none;">Supprimer le compte</button>
          </div>
        </li>
      </ul>
    </nav>
  </header>
  <div class="shop-container">
    <!-- Sidebar de filtres -->
    <aside class="sidebar-filters">
      <h2 style="font-size:1.2rem;color:#bc6288;margin-bottom:1.5rem;text-align:center;">Filtres</h2>
      <div class="filter-section">
        <h3>Recherche</h3>
        <input type="text" placeholder="Rechercher un produit..." class="search-input" id="searchInput">
      </div>
      <div class="filter-section">
        <h3>Catégories</h3>
        <div class="filter-options" id="categories-filters">
          <!-- Les catégories seront chargées depuis l'API -->
        </div>
      </div>
      <div class="filter-section">
        <h3>Prix</h3>
        <div class="price-inputs">
          <input type="number" placeholder="Min" min="0" id="minPrice">
          <span>à</span>
          <input type="number" placeholder="Max" min="0" id="maxPrice">
        </div>
      </div>
      <div class="filter-section">
        <h3>Couleurs (max 5)</h3>
        <div class="color-selection">
          <input type="color" id="colorPicker" class="color-picker">
          <button id="addColor" class="add-color-btn">Ajouter</button>
          <button id="resetColors" class="reset-btn">Réinitialiser</button>
        </div>
        <div class="selected-colors"></div>
        <p class="color-counter">0/5 couleurs sélectionnées</p>
      </div>
      <div class="filter-actions" style="margin-top:1.5rem;">
        <button id="applyFilters" class="apply-filters-btn">Appliquer les filtres</button>
        <button id="resetAllFilters" class="reset-all-btn">Réinitialiser tous les filtres</button>
      </div>
    </aside>
    <!-- Zone produits -->
    <main class="products-area" id="products-area">
      <!-- Les catégories et produits seront chargés depuis l'API -->
      <div style="text-align: center; color: #bc6288; padding: 60px 20px;">
        <h2>Boutique en construction</h2>
        <p>Les produits seront bientôt disponibles via notre API.</p>
      </div>
    </main>
  </div>
  <script src="../static/js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const userEmail = document.getElementById('user-email');
      const loginBtn = document.getElementById('login-btn');
      const logoutBtn = document.getElementById('logout-btn');
      const deleteBtn = document.getElementById('delete-btn');
      const profilePanel = document.getElementById('profile-panel');
      const profileLink = document.getElementById('profile-link');

      // Vérifier la connexion
      const userData = JSON.parse(localStorage.getItem('user'));
      if (userData) {
          userEmail.textContent = userData.email;
          userEmail.style.display = 'block';
          loginBtn.style.display = 'none';
          logoutBtn.style.display = 'block';
          deleteBtn.style.display = 'block';
      }

      // Gestion du panel
      profileLink.addEventListener('click', function(e) {
          e.preventDefault();
          profilePanel.style.display = profilePanel.style.display === 'block' ? 'none' : 'block';
      });

      document.addEventListener('click', function(e) {
          if (!profilePanel.contains(e.target) && e.target !== profileLink) {
              profilePanel.style.display = 'none';
          }
      });

      // Boutons
      loginBtn.addEventListener('click', () => window.location.href = 'account.html');
      logoutBtn.addEventListener('click', () => {
          localStorage.removeItem('user');
          localStorage.removeItem('auth_token');
          window.location.reload();
      });
    });

    let selectedColors = [];

    function setupFilters() {
      const colorCounter = document.querySelector('.color-counter');
      const colorPicker = document.getElementById('colorPicker');
      const addColorBtn = document.getElementById('addColor');
      const resetColorsBtn = document.getElementById('resetColors');
      const selectedColorsDiv = document.querySelector('.selected-colors');
      
      addColorBtn.addEventListener('click', () => {
        const color = colorPicker.value;
        if (selectedColors.includes(color)) {
          alert('Cette couleur est déjà sélectionnée');
          return;
        }
        if (selectedColors.length >= 5) {
          alert('Vous ne pouvez pas sélectionner plus de 5 couleurs');
          return;
        }
        selectedColors.push(color);
        updateSelectedColorsDisplay();
      });
      
      resetColorsBtn.addEventListener('click', () => {
        selectedColors = [];
        updateSelectedColorsDisplay();
      });
      
      function updateSelectedColorsDisplay() {
        selectedColorsDiv.innerHTML = '';
        selectedColors.forEach(color => {
          const colorDiv = document.createElement('div');
          colorDiv.className = 'color-dot';
          colorDiv.style.background = color;
          colorDiv.title = color;
          colorDiv.addEventListener('click', () => {
            selectedColors = selectedColors.filter(c => c !== color);
            updateSelectedColorsDisplay();
          });
          selectedColorsDiv.appendChild(colorDiv);
        });
        colorCounter.textContent = `${selectedColors.length}/5 couleurs sélectionnées`;
      }
      
      document.getElementById('applyFilters').addEventListener('click', () => {
        // TODO: Implémenter les filtres avec l'API
        console.log('Filtres à appliquer:', {
          search: document.getElementById('searchInput').value,
          minPrice: document.getElementById('minPrice').value,
          maxPrice: document.getElementById('maxPrice').value,
          colors: selectedColors
        });
      });
      
      document.getElementById('resetAllFilters').addEventListener('click', () => {
        document.getElementById('searchInput').value = '';
        document.getElementById('minPrice').value = '';
        document.getElementById('maxPrice').value = '';
        selectedColors = [];
        updateSelectedColorsDisplay();
        // TODO: Recharger tous les produits depuis l'API
      });
    }

    // Maintenant on va charger les produits depuis l'API
    document.addEventListener('DOMContentLoaded', async function() {
      try {
        // Charger les catégories depuis l'API
        const categoriesResponse = await fetch('http://localhost:5000/api/v1/categories');
        const categories = await categoriesResponse.json();
        
        // Charger les produits depuis l'API  
        const productsResponse = await fetch('http://localhost:5000/api/v1/products');
        const products = await productsResponse.json();
        
        displayProductsFromAPI(categories, products);
      } catch (error) {
        console.error('Erreur chargement données:', error);
      }
    });

    // Affichage du cadenas admin
    const userData = JSON.parse(localStorage.getItem('user'));
    const adminAccess = document.getElementById('admin-access');
    
    if (userData && userData.is_admin) {
        adminAccess.style.display = 'block';
    }

    // Charger les données depuis l'API
    document.addEventListener('DOMContentLoaded', async function() {
      try {
        console.log('Chargement des données...');
        
        // Charger les catégories
        const categoriesResponse = await fetch('http://localhost:5000/api/v1/categories');
        if (!categoriesResponse.ok) {
          throw new Error('Erreur chargement catégories');
        }
        const categories = await categoriesResponse.json();
        console.log('Catégories chargées:', categories);
        
        // Charger les produits (gestion d'erreur pour is_on_sale)
        let products = [];
        try {
          const productsResponse = await fetch('http://localhost:5000/api/v1/products');
          if (productsResponse.ok) {
            products = await productsResponse.json();
            console.log('Produits chargés:', products);
          }
        } catch (error) {
          console.warn('Erreur chargement produits:', error);
          products = [];
        }
        
        displayProductsFromAPI(categories, products);
      } catch (error) {
        console.error('Erreur chargement données:', error);
        // Afficher un message d'erreur
        const productsArea = document.getElementById('products-area');
        productsArea.innerHTML = '<div style="text-align: center; color: #bc6288; padding: 60px 20px;"><h2>Erreur de chargement</h2><p>Impossible de charger les données depuis l\'API.</p></div>';
      }
    });

    function displayProductsFromAPI(categories, products) {
      const productsArea = document.getElementById('products-area');
      productsArea.innerHTML = '';

      console.log('Affichage - Catégories:', categories.length, 'Produits:', products.length);

      if (categories.length === 0) {
        productsArea.innerHTML = '<div style="text-align: center; color: #bc6288; padding: 60px 20px;"><h2>Aucune catégorie disponible</h2><p>Créez des catégories dans l\'interface admin.</p></div>';
        return;
      }

      categories.forEach(category => {
        console.log('Processing category:', category);
        const categoryProducts = products.filter(p => p.category && p.category.id === category.id);
        console.log(`Products for category ${category.name}:`, categoryProducts.length);
        
        const categorySection = document.createElement('section');
        categorySection.className = 'category-section';
        categorySection.innerHTML = `
          <h2>${category.name} (${categoryProducts.length} produits)</h2>
          <div class="products-carousel">
            <button class="carousel-btn prev-btn" onclick="scrollCarousel('${category.id}', -1)">‹</button>
            <div class="products-grid" id="category-${category.id}">
              ${categoryProducts.length > 0 ? 
                categoryProducts.map(product => `
                  <div class="product-card">
                    <h3>${product.name}</h3>
                    <p class="product-price">${product.price}€</p>
                    <p class="product-stock">Stock: ${product.stock || 0}</p>
                    <button class="add-to-cart" onclick="addToCart(${JSON.stringify(product).replace(/"/g, '&quot;')})">Commander</button>
                  </div>
                `).join('') :
                '<div style="text-align: center; color: #666; padding: 20px;">Aucun produit dans cette catégorie</div>'
              }
            </div>
            <button class="carousel-btn next-btn" onclick="scrollCarousel('${category.id}', 1)">›</button>
          </div>
        `;
        productsArea.appendChild(categorySection);
      });
    }

    function scrollCarousel(categoryId, direction) {
      const grid = document.getElementById(`category-${categoryId}`);
      const cardWidth = 280; // largeur d'une carte + gap
      grid.scrollLeft += direction * cardWidth * 2; // scroll de 2 cartes à la fois
    }

    function addToCart(product) {
      let cart = JSON.parse(localStorage.getItem('cart') || '[]');
      cart.push(product);
      localStorage.setItem('cart', JSON.stringify(cart));
      updateCartCount();
      alert('Produit ajouté au panier !');
    }

    // Panier badge
    function updateCartCount() {
      const cart = JSON.parse(localStorage.getItem('cart') || '[]');
      const badge = document.getElementById('cart-count');
      if (badge) {
        badge.textContent = cart.length;
        badge.style.display = cart.length > 0 ? 'inline-block' : 'none';
      }
    }
    document.addEventListener('DOMContentLoaded', updateCartCount);

    // Panel profil
    document.addEventListener('DOMContentLoaded', function() {
      const profileLink = document.getElementById('profile-link');
      const profilePanel = document.getElementById('profile-panel');
      profileLink.addEventListener('click', function(e) {
        e.preventDefault();
        profilePanel.style.display = profilePanel.style.display === 'block' ? 'none' : 'block';
      });
      document.addEventListener('click', function(e) {
        if (!profilePanel.contains(e.target) && e.target !== profileLink) {
          profilePanel.style.display = 'none';
        }
      });
      let loggedIn = false;
      document.getElementById('login-btn').onclick = function() {
        loggedIn = true;
        this.style.display = 'none';
        document.getElementById('logout-btn').style.display = '';
      };
      document.getElementById('logout-btn').onclick = function() {
        loggedIn = false;
        this.style.display = 'none';
        document.getElementById('login-btn').style.display = '';
      };
      document.getElementById('delete-btn').onclick = function() {
        alert('Suppression du compte (fonctionnalité à venir)');
      };
    });

    window.onload = () => {
      allProducts = JSON.parse(localStorage.getItem('products') || '[]');
      displayProducts(allProducts);
      setupFilters();
      updateCartCount();
    };
  </script>

  <style>
    .products-carousel {
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .carousel-btn {
      background: #bc6288;
      color: white;
      border: none;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      font-size: 20px;
      cursor: pointer;
      flex-shrink: 0;
      z-index: 2;
    }

    .carousel-btn:hover {
      background: #ab597c;
    }

    .products-grid {
      display: flex;
      gap: 20px;
      overflow-x: auto;
      scroll-behavior: smooth;
      flex: 1;
      padding: 10px 0;
    }

    .products-grid::-webkit-scrollbar {
      height: 8px;
    }

    .products-grid::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 4px;
    }

    .products-grid::-webkit-scrollbar-thumb {
      background: #bc6288;
      border-radius: 4px;
    }

    .product-card {
      min-width: 260px;
      flex-shrink: 0;
    }
    .out-of-stock-banner {
      background: #bc6288;
      color: #fff;
      font-size: 1rem;
      font-weight: bold;
      padding: 7px 0;
      border-radius: 8px 8px 0 0;
      text-align: center;
      letter-spacing: 0.04em;
      margin-bottom: 10px;
      width: 100%;
    }
  </style>
</body>
</html>
