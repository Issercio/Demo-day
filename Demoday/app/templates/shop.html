  <div class="shop-container">
    <!-- Sidebar de filtres -->

      </div>
      <div class="filter-section">
        <h3>Catégories</h3>
        <div class="filter-options" id="categories-filters"></div>
      </div>
      <div class="filter-section">
        <h3>Prix</h3>
        <div class="price-inputs">
          <input type="number" placeholder="Min" min="0" id="minPrice">

    <!-- Zone produits -->

      <!-- Les catégories et produits seront chargés depuis l'API -->

  <div id="cart-toast" class="cart-toast" aria-live="polite" role="status"></div>
  <script src="../static/js/api.js?v=20260918-nav6"></script>
  <script>
    let selectedColors = [];
    let allCategories = [];
    let allProducts = [];
    let activeTheme = null;
    let themeProductNames = null;

    const colorPalette = ['#e8a0bf', '#c8a2c8', '#d94f70', '#9bb7e8', '#e85d4c', '#f0c419', '#7d9b76', '#f7f1e8', '#9b7bb8', '#ffc75f', '#6b4c9a', '#bc6288'];

    function normalizeHexColor(color) {
      if (!color) {
        return '';
      }
      return color.toLowerCase();
    }

    function productSlug(name) {
      return String(name || '')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '');
    }

    function productImage(product) {
      if (product && product.image) {
        return product.image;
      }
      const slug = productSlug(product && product.name);
      return slug ? `/static/img/products/${slug}.jpg` : '';
    }

    function categoryBlurb(categoryName) {
      const blurbs = {
        'Fleurs Fraîches': 'Cueilli du matin, bouquet d\'atelier',
        'Compositions': 'Pièce d\'atelier, volume généreux',
        'Fleurs Séchées': 'Séchage naturel, belle tenue',
        "Plantes d'intérieur": 'Plante vivante, pot décoratif',
        'Mariage & Événements': 'Création cérémonie, sur-mesure',
        'Deuil': 'Hommage floral, tons doux',
        'Cadeaux': 'Prêt à offrir, petit geste'
      };
      return blurbs[categoryName] || 'Création florale Pivoine & Lilas';
    }

    function pickProductColor(product) {
      const customColor = product.color || product.hex_color;
      if (customColor) {
        return normalizeHexColor(customColor);
      }

      const seed = `${product.id || ''}-${product.name || ''}`;
      let hash = 0;
      for (let i = 0; i < seed.length; i += 1) {
        hash = (hash * 31 + seed.charCodeAt(i)) >>> 0;
      }
      return colorPalette[hash % colorPalette.length];
    }

    function parsePrice(value) {
      if (value === null || value === undefined || String(value).trim() === '') {
        return null;
      }
      const n = Number(value);
      return Number.isFinite(n) ? n : null;
    }

    function hexToRgb(hex) {
      const normalized = normalizeHexColor(hex).replace('#', '');
      if (normalized.length !== 6) {
        return null;
      }
      return {
        r: parseInt(normalized.slice(0, 2), 16),
        g: parseInt(normalized.slice(2, 4), 16),
        b: parseInt(normalized.slice(4, 6), 16)
      };
    }

    function isColorMatch(candidate, selected) {
      return normalizeHexColor(candidate) === normalizeHexColor(selected);
    }

    function applyFiltersToProducts(products) {
      const searchText = (document.getElementById('searchInput').value || '').trim().toLowerCase();
      const minPrice = parsePrice(document.getElementById('minPrice').value);
      const maxPrice = parsePrice(document.getElementById('maxPrice').value);

      return products.filter((product) => {
        const productName = (product.name || '').toLowerCase();
        const price = Number(product.price);
        const productColor = pickProductColor(product);

        if (searchText && !productName.includes(searchText)) {
          return false;
        }

        if (minPrice !== null && price < minPrice) {
          return false;
        }

        if (maxPrice !== null && price > maxPrice) {
          return false;
        }

        const selectedCategoryIds = getSelectedCategoryIds();
        if (selectedCategoryIds && !(product.category && selectedCategoryIds.has(Number(product.category.id)))) {
          return false;
        }

        if (selectedColors.length > 0) {
          const matchesAtLeastOne = selectedColors.some((selectedColor) => isColorMatch(productColor, selectedColor));
          if (!matchesAtLeastOne) {
            return false;
          }
        }

        if (themeProductNames && !themeProductNames.has(product.name)) {
          return false;
        }

        return true;
      });
    }

    function refreshProductsWithCurrentFilters() {
      const filteredProducts = applyFiltersToProducts(allProducts);
      displayProductsFromAPI(allCategories, filteredProducts);
    }

    function getSelectedCategoryIds() {
      const inputs = [...document.querySelectorAll('#categories-filters input[type="checkbox"]')];
      if (inputs.length === 0) {
        return null;
      }
      const checked = inputs.filter((input) => input.checked).map((input) => Number(input.value));
      if (checked.length === 0 || checked.length === inputs.length) {
        return null;
      }
      return new Set(checked);
    }

    function renderCategoryFilters() {
      const box = document.getElementById('categories-filters');
      if (!box) {
        return;
      }
      box.innerHTML = allCategories.map((category) => `
        <label>
          <input type="checkbox" value="${Number(category.id)}" checked>
          <span>${escapeHtml(category.name)}</span>
        </label>
      `).join('');
      box.querySelectorAll('input').forEach((input) => {
        input.addEventListener('change', refreshProductsWithCurrentFilters);
      });
    }

    function toggleColorSelection(color, presetButtons) {
      const normalized = color.toLowerCase();
      if (selectedColors.includes(normalized)) {
        selectedColors = selectedColors.filter((item) => item !== normalized);
      } else if (selectedColors.length >= 5) {
        return;
      } else {
        selectedColors.push(normalized);
      }
      presetButtons.forEach((btn) => {
        btn.classList.toggle('is-selected', selectedColors.includes(btn.dataset.color));
      });
      refreshProductsWithCurrentFilters();
    }

    function setupFilters() {
      const presetColorsDiv = document.getElementById('presetColors');
      const presetButtons = [];
      colorPalette.forEach((color) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'preset-color-btn';
        btn.style.background = color;
        btn.dataset.color = color.toLowerCase();
        btn.title = color;
        btn.addEventListener('click', () => toggleColorSelection(color, presetButtons));
        presetButtons.push(btn);
        presetColorsDiv.appendChild(btn);
      });

      ['searchInput', 'minPrice', 'maxPrice'].forEach((id) => {
        const field = document.getElementById(id);
        if (field) {
          field.addEventListener('input', refreshProductsWithCurrentFilters);
        }
      });

      document.getElementById('resetAllFilters').addEventListener('click', () => {
        document.getElementById('searchInput').value = '';
        document.getElementById('minPrice').value = '';
        document.getElementById('maxPrice').value = '';
        selectedColors = [];
        document.querySelectorAll('#categories-filters input[type="checkbox"]').forEach((input) => {
          input.checked = true;
        });
        presetButtons.forEach((btn) => btn.classList.remove('is-selected'));
        if (themeProductNames) {
          syncCategoryChecksToTheme();
        }
        refreshProductsWithCurrentFilters();
      });
    }

    async function loadShopData() {
      try {
        const categoriesResponse = await fetch('/api/v1/categories');
        if (!categoriesResponse.ok) {
          throw new Error('Erreur chargement catégories');
        }
        const categories = await categoriesResponse.json();

        let products = [];
        const productsResponse = await fetch('/api/v1/products');
        if (productsResponse.ok) {
          products = await productsResponse.json();
        }

        allCategories = categories.filter((category) => category.name !== 'Abonnements');
        allProducts = products.filter((product) => !(product.category && product.category.name === 'Abonnements'));
        await applyShopTheme();
        renderCategoryFilters();
        syncCategoryChecksToTheme();

        if (window.apiService) {
          apiService.updateProfileUI();
        }

        refreshProductsWithCurrentFilters();
      } catch (error) {
        console.error('Erreur chargement données:', error);
        const productsArea = document.getElementById('products-area');
        productsArea.innerHTML = '<div style="text-align: center; color: #bc6288; padding: 60px 20px;"><h2>Erreur de chargement</h2><p>Impossible de charger les données depuis l\'API.</p></div>';
      }
    }

    function displayProductsFromAPI(categories, products) {
      const productsArea = document.getElementById('products-area');
      productsArea.innerHTML = '';

      console.log('Affichage - Catégories:', categories.length, 'Produits:', products.length);

      if (categories.length === 0) {
        productsArea.innerHTML = '<div style="text-align: center; color: #bc6288; padding: 60px 20px;"><h2>Aucune catégorie disponible</h2><p>Créez des catégories dans l\'interface admin.</p></div>';
        return;
      }

      categories.forEach(category => {
        const selectedCategoryIds = getSelectedCategoryIds();
        if (selectedCategoryIds && !selectedCategoryIds.has(Number(category.id))) {
          return;
        }
        console.log('Processing category:', category);
        const categoryProducts = products.filter(p => p.category && p.category.id === category.id);
        console.log(`Products for category ${category.name}:`, categoryProducts.length);
        if (categoryProducts.length === 0) {
          return;
        }
        
        const categorySection = document.createElement('section');
        categorySection.className = 'category-section';
        categorySection.innerHTML = `
          <h2>${escapeHtml(category.name)} (${categoryProducts.length} ${categoryProducts.length > 1 ? 'produits' : 'produit'})</h2>
          <div class="products-grid" id="category-${category.id}">
              ${categoryProducts.length > 0 ? 
                categoryProducts.map(product => {
                  // Récupérer le statut de stock depuis localStorage
                  const stockStatus = getProductStockStatus(product.id);
                  const stockBanner = getStockBanner(stockStatus);
                  const isOutOfStock = stockStatus === 'out';
                  
                  const hex = pickProductColor(product);
                  const photo = productImage(product);
                  const blurb = categoryBlurb(category.name);
                  
                  return `
                    <div class="product-card">
                      ${stockBanner}
                      <div class="product-photo">
                        <img src="${escapeHtml(photo)}" alt="${escapeHtml(product.name)}" loading="lazy">
                        <span class="product-color-pip" title="Teinte du bouquet" style="background:${escapeHtml(hex)};"></span>
                      </div>
                      <div class="product-body">
                        <h3>${escapeHtml(product.name)}</h3>
                        <p class="product-blurb">${escapeHtml(blurb)}</p>
                        <p class="product-price">${Number(product.price).toFixed(2)}€</p>
                        <button class="add-to-cart" onclick="addToCartById(${Number(product.id)})" 
                                ${isOutOfStock ? 'disabled style="background:#ccc;cursor:not-allowed;"' : ''}>
                          ${isOutOfStock ? 'Rupture de stock' : 'Commander'}
                        </button>
                      </div>
                    </div>
                  `;
                }).join('') :
                '<div class="empty-category">Aucun produit dans cette catégorie</div>'
              }
          </div>
        `;
        productsArea.appendChild(categorySection);
      });
      if (!productsArea.querySelector('.category-section')) {
        productsArea.innerHTML = '<div style="text-align: center; color: #bc6288; padding: 60px 20px;"><h2>Aucun bouquet pour ce filtre</h2><p>Effacez les filtres pour revoir la vitrine du shop.</p></div>';
      }
    }

    function renderThemeBanner() {
      const banner = document.getElementById('theme-banner');
      if (!banner) {
        return;
      }
      if (!activeTheme) {
        banner.hidden = true;
        banner.innerHTML = '';
        return;
      }
      banner.hidden = false;
      banner.innerHTML = `
        <p><strong>${escapeHtml(activeTheme.label)}</strong> — ${escapeHtml(activeTheme.blurb)}</p>
      `;
    }

    function syncCategoryChecksToTheme() {
      const inputs = document.querySelectorAll('#categories-filters input[type="checkbox"]');
      if (!themeProductNames || inputs.length === 0) {
        return;
      }
      const themedIds = new Set(
        allProducts
          .filter((product) => themeProductNames.has(product.name) && product.category)
          .map((product) => Number(product.category.id))
      );
      inputs.forEach((input) => {
        input.checked = themedIds.has(Number(input.value));
      });
    }

    async function applyShopTheme() {
      try {
        const response = await fetch('/api/v1/themes');
        if (!response.ok) {
          activeTheme = null;
          themeProductNames = null;
          renderThemeBanner();
          return;
        }
        const payload = await response.json();
        const names = payload.product_names || [];
        const ids = payload.applied_ids || [];
        if (!ids.length) {
          activeTheme = null;
          themeProductNames = null;
          renderThemeBanner();
          return;
        }
        activeTheme = {
          label: payload.label || ids.join(' + '),
          blurb: payload.blurb || ''
        };
        themeProductNames = new Set(names);
        renderThemeBanner();
      } catch (err) {
        console.error('Thème boutique:', err);
        activeTheme = null;
        themeProductNames = null;
        renderThemeBanner();
      }
    }

    function getProductStockStatus(productId) {
      const stockData = JSON.parse(localStorage.getItem('productStock') || '{}');
      return stockData[productId] || 'available';
    }

    function getStockBanner(status) {
      switch(status) {
        case 'low':
          return '<div class="stock-banner low-stock-banner">Bientôt épuisé !</div>';
        case 'out':
          return '<div class="stock-banner out-of-stock-banner">Rupture de stock !</div>';
        default:
          return '';
      }
    }

    function addToCartById(productId) {
      const product = allProducts.find((item) => Number(item.id) === Number(productId));
      if (!product) {
        return;
      }
      addToCart(product);
    }

    function addToCart(product) {
      FloraCart.add({ ...product, quantity: 1 });
      updateCartCount();
      showCartToast(`${product.name} a été ajouté au panier`);
    }

    let cartToastTimer = null;
    function showCartToast(message) {
      const toast = document.getElementById('cart-toast');
      if (!toast) {
        return;
      }
      toast.textContent = message;
      toast.classList.add('is-visible');

      if (cartToastTimer) {
        clearTimeout(cartToastTimer);
      }
      cartToastTimer = setTimeout(() => {
        toast.classList.remove('is-visible');
      }, 2200);
    }

    // Panier badge
    function updateCartCount() {
      const badge = document.getElementById('cart-count');
      if (!badge) {
        return;
      }
      const total = FloraCart.count();
      badge.textContent = String(total);
      badge.style.display = total > 0 ? 'inline-block' : 'none';
    }
    document.addEventListener('DOMContentLoaded', updateCartCount);

    document.addEventListener('DOMContentLoaded', async () => {
      setupFilters();
      updateCartCount();
      await loadShopData();
    });
  </script>

  <style>
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.4rem;
      overflow: visible;
    }

    .product-card {
      min-width: 0;
      width: 100%;
      box-sizing: border-box;
      padding: 0;
      overflow: hidden;
      align-items: stretch;
    }

    .product-card h3 {
      overflow-wrap: anywhere;
      word-break: break-word;
      min-height: 0;
      margin-bottom: 0.35rem;
    }

    .empty-category {
      grid-column: 1 / -1;
      text-align: center;
      color: #666;
      padding: 20px;
    }

    .stock-banner {
      font-size: 0.85rem;
      font-weight: bold;
      padding: 6px 0;
      border-radius: 8px 8px 0 0;
      text-align: center;
      letter-spacing: 0.04em;
      margin-bottom: 10px;
      width: 100%;
    }

    .low-stock-banner {
      background: #fff3cd;
      color: #856404;
      border: 1px solid #ffeaa7;
    }

    .out-of-stock-banner {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .cart-toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      max-width: 360px;
      background: #231111;
      color: #fff;
      padding: 12px 16px;
      border-radius: 10px;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.2);
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 4500;
      font-size: 0.95rem;
    }

    .cart-toast.is-visible {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</body>
