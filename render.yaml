services:
  - type: web
    name: florashop
    runtime: python
    plan: free
    buildCommand: pip install -r Demoday/requirements.txt
    startCommand: cd Demoday && gunicorn -b 0.0.0.0:$PORT run:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: DATABASE_URL
        value: sqlite:///florashop.db
      - key: SECRET_KEY
        generateValue: true
      - key: FORCE_HTTPS
        value: "1"
      - key: MAIL_SERVER
        value: ""
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_STARTTLS
        value: "1"
      - key: MAIL_FROM
        value: ""
      - key: MAIL_TO
        value: ""
